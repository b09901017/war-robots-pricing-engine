<script>
(function () {
  'use strict';

  /* ====================================================================
     小工具
     ==================================================================== */

  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) {
      for (var k in props) {
        if (!Object.prototype.hasOwnProperty.call(props, k)) continue;
        var v = props[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'svg') el.innerHTML = v;          // 只用在本檔定義的圖示常數
        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2).toLowerCase(), v);
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }

  function append(parent, child) {
    if (child === null || child === undefined || child === false) return;
    if (Array.isArray(child)) {
      for (var i = 0; i < child.length; i++) append(parent, child[i]);
    } else if (child instanceof Node) {
      parent.appendChild(child);
    } else {
      parent.appendChild(document.createTextNode(String(child)));
    }
  }

  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
  function $(id) { return document.getElementById(id); }

  var ICON = {
    board: '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 15V9M7.7 15V4M12.3 15v-4M17 15V7"/></svg>',
    box: '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M10 2.6 17 6.3v7.4L10 17.4 3 13.7V6.3z"/><path d="M3 6.3 10 10l7-3.7M10 10v7.4"/></svg>',
    calc: '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="2.5" width="13" height="15" rx="2"/><path d="M6.5 6h7M7 10h.01M10 10h.01M13 10h.01M7 13.5h.01M10 13.5h.01M13 13.5h.01"/></svg>',
    tune: '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 6h6M13 6h4M3 14h4M11 14h6"/><circle cx="11" cy="6" r="2"/><circle cx="9" cy="14" r="2"/></svg>',
    plus: '<svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 4.5v11M4.5 10h11"/></svg>',
    close: '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>',
    check: '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg>',
    alert: '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 3.2 18 16.8H2z"/><path d="M10 8v3.4M10 14.2h.01"/></svg>',
    minus: '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M5 10h10"/></svg>',
    equal: '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M5 7.8h10M5 12.2h10"/></svg>',
    trash: '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h12M8 6V4.5h4V6M6 6l.7 10h6.6L15 6"/></svg>',
    sync: '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 8.5A6.5 6.5 0 0 0 5 5.6V3.5M3.5 11.5A6.5 6.5 0 0 0 15 14.4v2.1"/><path d="M3.3 5.6H5V3.5M16.7 14.4H15v2.1"/></svg>',
    lock: '<svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4.5" y="8.5" width="11" height="8" rx="2"/><path d="M7 8.5V6.5a3 3 0 0 1 6 0v2"/></svg>',
    backspace: '<svg viewBox="0 0 24 20" width="20" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3.5h12a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5H8L2.5 10z"/><path d="M11.5 7.5l5 5M16.5 7.5l-5 5"/></svg>',
    back: '<svg viewBox="0 0 20 20" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 5 6.5 10l5 5"/></svg>',
    theme: '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M16.5 11.4A6.8 6.8 0 0 1 8.6 3.5a6.8 6.8 0 1 0 7.9 7.9z"/></svg>'
  };

  var SERIES = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)'];
  var OTHER_COLOR = 'var(--s6)';

  var CONF_TEXT = { high: '高信心', mid: '中信心', low: '低信心', none: '無資料' };

  var fmtQty = WR_CATALOG.formatQty;
  var fmtPrice = WR_CATALOG.formatUnitPrice;
  /** 看板與試算一律顯示「計價單位單價」；引擎內部仍是每 1 單位的原始值。 */
  var dPrice = WR_CATALOG.formatDisplayPrice;
  var dUnit = WR_CATALOG.priceUnitLabel;
  var fmtMoney = WR_CATALOG.formatMoney;
  var group = WR_CATALOG.groupDigits;

  function pct(v, digits) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    return (v * 100).toFixed(digits === undefined ? 0 : digits) + '%';
  }

  /* ====================================================================
     狀態
     ==================================================================== */

  var DEFAULT_SETTINGS = {
    method: 'robust',
    dropDominatedSingles: true,
    priorWeight: 1,
    relativeWeighting: true,
    samples: 240,
    interval: 0.8
  };

  var state = {
    ready: false,
    view: 'board',
    bundles: [],
    settings: clone(DEFAULT_SETTINGS),
    priors: {},
    model: null,
    /**
     * 四種算法的對照模型。建一次要 0.2～0.5 秒，但它只跟「禮包 + 參考值 + 設定」
     * 有關，跟你正在打的那一包無關 —— 所以建一次就存著，之後每按一個數字只要
     * 拿現成的模型各評一次（不到一毫秒），四個答案才能跟著打字即時更新。
     */
    compare: null,
    /** 上面那份快取要比對的指紋，由 recompute() 維護。 */
    compareKey: '',
    spreadsheetUrl: '',
    spreadsheetName: '',
    editor: null,
    draft: { name: '', price: null, qty: {} },
    /** 禮包清單的篩選與排序。只影響畫面，不影響推算。 */
    filter: { items: [], sort: 'date' },
    /** 看板上那排「資料說明」是否展開。 */
    showNotes: false,
    /** 試算頁「每一種算法在做什麼」是否展開。 */
    showMethodNotes: false,
    busy: false
  };

  function clone(o) {
    var out = {};
    for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) out[k] = o[k];
    return out;
  }

  function merge(base, extra) {
    var out = clone(base);
    for (var k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) out[k] = extra[k];
    return out;
  }

  var VIEWS = [
    { id: 'board', title: '單價看板', icon: ICON.board, label: '看板' },
    { id: 'bundles', title: '禮包紀錄', icon: ICON.box, label: '禮包' },
    { id: 'evaluate', title: '性價比試算', icon: ICON.calc, label: '試算' },
    { id: 'settings', title: '設定與鎖定', icon: ICON.tune, label: '設定' }
  ];

  /* ====================================================================
     推算：每次資料變動就在瀏覽器裡重算一次，不需要等伺服器
     ==================================================================== */

  /**
   * state.priors 存的是使用者看到、也是試算表裡的「計價單位」數字，
   * 引擎要的是每 1 單位的原始單價。整個 app 只有這裡做這個換算。
   */
  function engineOptions() {
    var priors = {};
    for (var id in state.priors) {
      if (Object.prototype.hasOwnProperty.call(state.priors, id)) {
        priors[id] = WR_CATALOG.toUnitPrice(id, state.priors[id]);
      }
    }
    var s = state.settings;
    return {
      priors: priors,
      method: s.method,
      dropDominatedSingles: s.dropDominatedSingles !== false,
      priorWeight: s.priorWeight,
      relativeWeighting: s.relativeWeighting,
      samples: s.samples,
      interval: s.interval
    };
  }

  function recompute() {
    var opt = engineOptions();
    state.model = WR_SOLVER.solve(state.bundles, opt);

    /*
     * 另一種口徑的解，只為了在看板上並排顯示。
     *
     * 「最好價格」和「平均行情」是兩個都合理、但意義完全不同的基準，
     * 要判斷一包划不划算得知道自己在看哪一種。跑第二次不做 bootstrap ——
     * 對照欄只需要點估計，區間用不到，省掉九成的時間。
     */
    state.altModel = WR_SOLVER.solve(state.bundles, merge(opt, {
      dropDominatedSingles: !opt.dropDominatedSingles,
      bootstrap: false
    }));
    // 資料或設定變了，四種算法的對照就過期了。
    state.compareKey = compareKey();
    if (state.compare && state.compare.key !== state.compareKey) state.compare = null;
  }

  /** 對照結果的有效性指紋：禮包、參考值、推算設定，任何一個動了就要重算。 */
  function compareKey() {
    return JSON.stringify([state.bundles, state.priors, state.settings]);
  }

  var compareTimer = null;
  /**
   * 等著模型建好的人，用「誰在等」當 key 而不是排成一列 ——
   * 編輯器每按一個鍵就會問一次，排成一列的話建好之後會把同一塊畫面重畫幾十遍。
   */
  var compareWaiters = {};
  /** 上一次建模型失敗的指紋。同一份資料不再重試，否則會在「重畫→重建→失敗」之間空轉。 */
  var compareError = null;

  function compareReady() {
    return !!(state.compare && state.compare.key === state.compareKey);
  }

  function compareBroken() {
    return compareError !== null && compareError.key === state.compareKey;
  }

  /**
   * 確保四種算法的模型已經建好。
   *
   * 建模型是同步的、要花好幾百毫秒，直接在 render 裡跑會讓畫面卡住不動，
   * 所以排到下一個 tick 再跑：這一輪先畫出「計算中」，建完了再叫 onReady
   * 重畫一次。同一時間只會排一個，等待的人排隊等同一份結果。
   *
   * @returns {boolean} true = 現在就能用；false = 已排入，好了會通知
   */
  function ensureCompare(who, onReady) {
    if (compareReady()) return true;
    if (compareBroken()) return false;
    if (onReady) compareWaiters[who] = onReady;
    if (compareTimer) return false;
    compareTimer = setTimeout(function () {
      compareTimer = null;
      try {
        state.compare = { key: state.compareKey, variants: WR_COMPARE.build(state.bundles, engineOptions()) };
        compareError = null;
      } catch (err) {
        console.error(err);
        compareError = { key: state.compareKey, message: (err && err.message) || String(err) };
      }
      var waiting = compareWaiters;
      compareWaiters = {};
      for (var k in waiting) {
        if (Object.prototype.hasOwnProperty.call(waiting, k)) waiting[k]();
      }
    }, 16);
    return false;
  }

  /**
   * 金額區間。上下界四捨五入後長得一樣就只寫一個數字 ——
   * 判準是「印出來一不一樣」而不是「差多少」：差 0.4 元卻印成
   * 「44 – 44」的話，那個破折號只是在製造雜訊。
   */
  function moneyRange(low, high) {
    if (low === null || high === null || low === undefined || high === undefined) return '—';
    var a = fmtMoney(low);
    var b = fmtMoney(high);
    return a === b ? a : a + ' – ' + b;
  }

  /** 性價比區間，同上。 */
  function ratioRange(row) {
    if (row.ratio === null) return '—';
    if (row.ratioLow === null || row.ratioHigh === null) return row.ratio.toFixed(2);
    var a = row.ratioLow.toFixed(2);
    var b = row.ratioHigh.toFixed(2);
    return a === b ? a : a + ' – ' + b;
  }

  var recomputeTimer = null;
  function recomputeSoon() {
    if (recomputeTimer) clearTimeout(recomputeTimer);
    recomputeTimer = setTimeout(function () {
      recomputeTimer = null;
      recompute();
      render();
    }, 320);
  }

  /* ====================================================================
     導覽
     ==================================================================== */

  function go(view) {
    state.view = view;
    render();
    window.scrollTo(0, 0);
  }

  function renderNav() {
    var rail = $('railNav');
    var tabs = $('tabBar');
    clear(rail); clear(tabs);
    VIEWS.forEach(function (v) {
      var current = state.view === v.id;
      rail.appendChild(h('button', {
        'aria-current': current ? 'page' : null,
        onclick: function () { go(v.id); }
      }, h('span', { class: 'ico', svg: v.icon }), v.title));
      tabs.appendChild(h('button', {
        'aria-current': current ? 'page' : null,
        onclick: function () { go(v.id); }
      }, h('span', { svg: v.icon }), h('span', { text: v.label })));
    });
  }

  function renderTopbar() {
    var v = VIEWS.filter(function (x) { return x.id === state.view; })[0];
    $('viewTitle').textContent = v.title;

    var m = state.model;
    var sub;
    if (!state.ready) sub = '讀取中…';
    else if (!m || m.bundleCount === 0) sub = '尚無禮包資料';
    else {
      sub = m.bundleCount + ' 筆禮包 · ' + m.items.length + ' 種物品 · ' +
        (m.fit.meaningful === false ? '方程式還不夠多' : '平均誤差 ' + pct(m.fit.mape, 1));
    }
    $('viewSub').textContent = sub;

    var actions = $('topActions');
    clear(actions);
    actions.appendChild(h('button', {
      class: 'btn btn-sm btn-ghost', title: '切換深色／淺色', 'aria-label': '切換深色或淺色主題',
      onclick: toggleTheme
    }, h('span', { svg: ICON.theme })));

    var rail = $('railConn');
    if (rail) {
      clear(rail);
      var connected = WRBridge.mode() === 'sheet';
      rail.appendChild(h('div', { class: 'pill ' + (connected ? 'conf-high' : 'conf-none'), style: 'width:100%; justify-content:flex-start' },
        h('span', { class: 'dot' }),
        connected ? '已連接試算表' : '資料存在這台裝置'));
      if (connected && state.spreadsheetUrl) {
        rail.appendChild(h('a', {
          class: 'btn btn-sm btn-ghost btn-block', style: 'margin-top:6px',
          href: state.spreadsheetUrl, target: '_blank', rel: 'noopener'
        }, '開啟試算表'));
      }
    }
  }

  /* ====================================================================
     單價看板
     ==================================================================== */

  function renderBoard() {
    var root = $('viewBoard');
    clear(root);
    var m = state.model;

    if (!m || m.bundleCount === 0) {
      root.appendChild(emptyState(
        '還沒有任何禮包',
        '先到「禮包」分頁記幾筆商城的組合包，引擎就會自動解出每種物品的基準單價。',
        '新增第一筆禮包', function () { go('bundles'); openEditor(null); }
      ));
      return;
    }

    /*
     * 需要你動手的（warn）永遠攤開；只是說明現況的（info）收成一行。
     * 功能一多，光是說明就能堆到四五張卡片，把真正要看的單價整個擠下去 ——
     * 那些說明每一句都有用，但不該每次打開 app 都重讀一遍。
     */
    var notices = m.warnings || [];
    var urgent = notices.filter(function (w) { return w.level === 'warn'; });
    var notes = notices.filter(function (w) { return w.level !== 'warn'; });

    urgent.forEach(function (w) {
      root.appendChild(h('div', { class: 'notice notice-warn' },
        h('span', { class: 'ico', svg: ICON.alert }), h('span', { text: w.text })));
    });

    if (notes.length) {
      root.appendChild(h('button', {
        class: 'notice notice-toggle', 'aria-expanded': state.showNotes ? 'true' : 'false',
        onclick: function () { state.showNotes = !state.showNotes; render(); }
      },
        h('span', { class: 'ico', svg: ICON.alert }),
        h('span', { text: state.showNotes ? '收起這 ' + notes.length + ' 則資料說明' : notes.length + ' 則資料說明（引擎為你的資料做了哪些處理）' })));
      if (state.showNotes) {
        notes.forEach(function (w) {
          root.appendChild(h('div', { class: 'notice' },
            h('span', { class: 'ico', svg: ICON.check }), h('span', { text: w.text })));
        });
      }
    }

    // 自由度不足時，擬合誤差必然趨近 0 —— 那不是模型準，是它還沒被考驗過。
    // 與其印一個會被誤讀成好消息的漂亮數字，不如直接說它還不算數。
    var solid = m.fit.meaningful !== false;
    root.appendChild(h('div', { class: 'stat-row' },
      stat('禮包樣本', group(m.bundleCount), '筆',
        m.excludedCount ? m.excludedCount + ' 筆被更便宜的同類壓過' : WR_SOLVER.methodInfo(m.method).label),
      stat('已解物品', group(m.items.length), '種',
        m.fit.dof === null ? m.solvedCount + ' 種參與求解' : '自由度 ' + m.fit.dof),
      solid
        ? stat('平均誤差', pct(m.fit.mape, 1), null, '模型回推售價的平均偏離')
        : stat('平均誤差', '尚不算數', null, '方程式還不夠多，解必然通過每一點')
    ));

    root.appendChild(basisCard());

    var head = h('div', { class: 'section-head' },
      h('div', { class: 'section-title', text: '基準單價' }),
      h('button', {
        class: 'btn btn-sm', onclick: syncBoard
      }, h('span', { svg: ICON.sync }), '同步到試算表'));

    var board = h('div', { class: 'board' });
    var groups = WR_CATALOG.groups();
    groups.forEach(function (g) {
      var rows = m.items.filter(function (it) { return it.group === g.id; });
      if (!rows.length) return;
      board.appendChild(h('div', { class: 'board-group-label', text: g.name }));
      rows.forEach(function (it) { board.appendChild(priceRow(it)); });
    });

    root.appendChild(h('section', { class: 'section' }, head,
      h('div', { class: 'section-note', text: '每個數字是「這個計價單位值多少台幣」，例如金幣與鑰匙都是每 1K。資料卡買不到半張，所以維持每張計價。淺色橫條是 80% 可能區間，直線是點估計；紫色虛線框是行情參考價 —— 它只是拿來對照的，不參與任何計算。' }),
      board));

    root.appendChild(fitSection(m));
  }

  var BASIS = [
    { id: 'best', drop: true, label: '最好價格',
      blurb: '同一個物品有好幾種賣法時，只採用最便宜的那個。這是「你實際買得到的最低價」，' +
        '所以一包東西只要不是最佳買法，就會顯示得比較差。' },
    { id: 'market', drop: false, label: '平均行情',
      blurb: '所有報價都算數，包括比較貴的小包。這是「商城平均而言怎麼賣」，' +
        '比較寬鬆，但也比較貼近你隨手看到一包時的參考基準。' }
  ];

  /**
   * 基準口徑切換。
   *
   * 「最好價格」和「平均行情」都是合理的基準，但意義差很多 —— 同一包東西在
   * 前者可能是「正常行情」，在後者卻是「超值」。所以不藏在設定裡，直接放在
   * 看板最上面，而且每一列都把另一種口徑的數字並排寫出來。
   */
  function basisCard() {
    var current = state.settings.dropDominatedSingles !== false ? 'best' : 'market';
    var info = BASIS.filter(function (b) { return b.id === current; })[0];

    var seg = h('div', { class: 'seg' });
    BASIS.forEach(function (b) {
      seg.appendChild(h('button', {
        class: b.id === current ? 'on' : '',
        onclick: function () {
          if (b.id === current) return;
          state.settings.dropDominatedSingles = b.drop;
          state.compare = null;
          recompute(); render(); persistSettings();
        }
      }, b.label));
    });

    var alt = state.altModel;
    var lines = [info.blurb];
    if (alt) {
      lines.push(current === 'best'
        ? '目前排除了 ' + state.model.excludedCount + ' 筆有更便宜替代品的單品包。'
        : '目前把 ' + alt.excludedCount + ' 筆比較貴的同類單品包也算進來了。');
    }

    return h('section', { class: 'section' },
      h('div', { class: 'section-head' },
        h('div', { class: 'section-title', text: '基準要怎麼算' })),
      h('div', { class: 'card card-pad', style: 'display:flex; flex-direction:column; gap:11px' },
        seg,
        h('div', { class: 'section-note', style: 'margin:0', text: lines.join(' ') })));
  }

  function stat(label, value, unit, foot) {
    return h('div', { class: 'stat' },
      h('div', { class: 'stat-label', text: label }),
      h('div', { class: 'stat-value' }, value, unit ? h('small', { text: unit }) : null),
      h('div', { class: 'stat-foot', text: foot })
    );
  }

  function priceRow(it) {
    var row = h('div', { class: 'price-row' });

    row.appendChild(h('div', { class: 'price-row-head' },
      h('span', { class: 'price-row-name', text: it.label }),
      h('span', { class: 'pill conf-' + it.confidence },
        h('span', { class: 'dot' }), CONF_TEXT[it.confidence]),
      it.priorPull !== null && it.priorPull > 0.1
        ? h('span', { class: 'pill conf-low' }, '參考值影響 ' + pct(it.priorPull))
        : null
    ));

    // 另一種基準口徑的數字並排寫出來 —— 差很多的話，代表這個物品的判斷
    // 會因為你選哪一種基準而完全不同，那件事必須看得見。
    var altPrice = state.altModel ? state.altModel.prices[it.id] : undefined;
    var altGap = (altPrice !== undefined && it.price > 0)
      ? Math.abs(altPrice - it.price) / it.price : 0;
    var otherLabel = state.settings.dropDominatedSingles !== false ? '平均行情' : '最好價格';

    // 行情參考價：使用者自己給的市場行情，沒有進過求解。
    // 放在這裡是因為「解出來的數字合不合理」只有跟它對照才看得出來。
    var ref = WR_CATALOG.refOf(it.id);

    row.appendChild(h('div', { class: 'price-row-value num' },
      dPrice(it.id, it.price), h('span', { class: 'unit', text: dUnit(it.id) }),
      altGap > 0.03
        ? h('span', { class: 'price-alt', text: otherLabel + ' ' + dPrice(it.id, altPrice) })
        : null,
      ref
        ? h('span', { class: 'price-alt price-ref' }, '行情參考 ', h('b', { text: WR_CATALOG.formatRef(it.id) }))
        : null));

    var hasBand = it.price > 0 && it.low !== null && it.high !== null && it.occurrences >= 2;

    // 每列只留兩件事：資料多不多、區間多寬。
    // 原本還塞了總數量與占比色條，四項擠在一起反而什麼都讀不進去。
    // 有效觀測遠低於出現包數 = 這個物品總是跟別的東西綁在一起，
    // 記再多包也分不出來。這是「為什麼我記了 30 包還是不準」唯一的解釋。
    var thin = it.effectiveObs !== null && it.occurrences >= 3 && it.effectiveObs < it.occurrences * 0.5;
    row.appendChild(h('div', { class: 'price-row-meta' },
      h('span', { text: '出現在 ' + it.occurrences + ' 包' }),
      thin ? h('span', { style: 'color:var(--serious-ink)',
        text: '但有效觀測只有 ' + it.effectiveObs.toFixed(1) + ' 次' }) : null,
      hasBand ? h('span', { text: dPrice(it.id, it.low) + ' – ' + dPrice(it.id, it.high) }) : null
    ));

    // 偏離行情參考價太多的時候直接寫出來。門檻訂在 25%：低於這個數的差距
    // 在這種等級的資料上本來就分不出是真的便宜還是模型誤差，寫出來只是雜訊。
    if (ref && it.price > 0) {
      var shown = WR_CATALOG.toDisplayPrice(it.id, it.price);
      if (shown < ref.low * 0.75) {
        row.appendChild(refNote('比你給的行情參考價低 ' + pct(1 - shown / ref.low) +
          '。商城這幾包確實比行情便宜，或者這個物品的價值被同包的其他東西吸走了。'));
      } else if (shown > ref.high * 1.25) {
        row.appendChild(refNote('比你給的行情參考價高 ' + pct(shown / ref.high - 1) +
          '。你記到的禮包偏貴，或者這個物品的單價被同包的其他東西墊高了。'));
      }
    }

    if (thin) {
      row.appendChild(note('它幾乎總是跟別的物品一起出現，方程式分不出各自的價值。' +
        '記一包「只含它」或搭配組合不同的禮包，這個數字才會真的被定住。'));
    }

    if (it.price === 0) {
      row.appendChild(note('解為 0 —— 這個物品總是跟別的東西綁在一起出現，資料還分不出它自己的價值。'));
    } else if (it.occurrences < 2) {
      row.appendChild(note('只出現在 1 包裡，這個數字完全取決於那一包怎麼定價，還不能當成行情。'));
    } else if (it.priorPull !== null && it.priorPull > 0.1) {
      row.appendChild(note('不看參考值的話會是 ' + dPrice(it.id, it.dataOnlyPrice) +
        '。差距大代表目前的資料還分不出這個物品的價值。'));
      if (hasBand) row.appendChild(rangeBar(it));
    } else if (hasBand) {
      row.appendChild(rangeBar(it));
    }

    return row;
  }

  function note(text) {
    return h('div', { class: 'price-row-meta', style: 'color:var(--serious-ink)' }, h('span', { text: text }));
  }

  /** 行情參考價相關的提示：用它自己的顏色，跟「資料有問題」那種警告區分開。 */
  function refNote(text) {
    return h('div', { class: 'price-row-meta', style: 'color:var(--ref-ink)' }, h('span', { text: text }));
  }

  /**
   * 區間條：橫軸是「相對於這個物品自己的點估計」，從 0 到 2 倍。
   * 每一列都用自己的尺度，所以條子的寬度就是相對不確定性 —— 銀幣跟終極資料卡
   * 差了八個數量級也能放在同一個看板上互相比較「有多不確定」。
   */
  function rangeBar(it) {
    var max = it.price * 2;
    var clamp = function (v) { return Math.max(0, Math.min(1, v / max)); };
    var lo = clamp(it.low);
    var hi = clamp(it.high);
    var overflow = it.high > max;

    // 行情參考價畫在同一條軸上。軸的單位是「每 1 單位的原始單價」，
    // 而 refUnitOf 回的也是原始單價，所以可以直接比 —— 這是刻意的：
    // 只要有一邊用顯示單位，這條線就會歪掉而且沒有人看得出來。
    var ref = WR_CATALOG.refUnitOf(it.id);
    var refLabel = ref ? '，行情參考 ' + WR_CATALOG.formatRef(it.id) + ' ' + dUnit(it.id) : '';

    var bar = h('div', { class: 'range', role: 'img',
      'aria-label': it.label + ' 每 ' + (WR_CATALOG.perLabel(it.id) || '1') + ' 單位 ' + dPrice(it.id, it.price) +
        ' 元，可能區間 ' + dPrice(it.id, it.low) + ' 到 ' + dPrice(it.id, it.high) + ' 元' + refLabel },
      h('div', { class: 'range-track' }),
      h('div', { class: 'range-band', style: 'left:' + (lo * 100) + '%; width:' + Math.max(1.5, (hi - lo) * 100) + '%' }),
      h('div', { class: 'range-point', style: 'left:calc(50% - 1.5px)' })
    );

    if (ref && ref.low < max) {
      var rl = clamp(ref.low);
      var rh = clamp(ref.high);
      bar.appendChild(h('div', {
        class: 'range-ref', 'data-point': ref.single ? 'true' : 'false',
        style: 'left:' + (rl * 100) + '%; width:' + (ref.single ? 0 : Math.max(1.5, (rh - rl) * 100)) + '%'
      }));
    }

    if (overflow) bar.appendChild(h('div', { class: 'range-overflow', text: '▸ ' + dPrice(it.id, it.high) }));
    return bar;
  }

  function fitSection(m) {
    if (!m.fit.predictions.length) return null;
    var active = m.fit.predictions.filter(function (p) { return !p.excluded; });
    var rows = active.slice(0, 8);
    var showWeight = m.method === 'robust';

    var table = h('table', { class: 'fit-table' },
      h('thead', null, h('tr', null,
        h('th', { text: '禮包' }),
        h('th', { class: 'n', text: '實際售價' }),
        h('th', { class: 'n', text: '模型估值' }),
        h('th', { class: 'n', text: '偏離' }),
        showWeight ? h('th', { class: 'n', text: '採信' }) : null
      )),
      h('tbody', null, rows.map(function (p) {
        var off = p.ratio - 1;
        var tone = Math.abs(off) < 0.1 ? 'var(--ink-3)' : (off > 0 ? 'var(--good-ink)' : 'var(--serious-ink)');
        return h('tr', null,
          h('td', { text: p.name || '（未命名）' }),
          h('td', { class: 'n', text: group(Math.round(p.actual)) }),
          h('td', { class: 'n', text: fmtMoney(p.predicted) }),
          h('td', { class: 'n', style: 'color:' + tone, text: (off >= 0 ? '+' : '') + pct(off, 1) }),
          showWeight ? h('td', { class: 'n',
            style: p.weight < 0.75 ? 'color:var(--serious-ink)' : 'color:var(--ink-3)',
            text: p.weight >= 0.995 ? '全部' : pct(p.weight) }) : null
        );
      }))
    );

    var blurb = showWeight
      ? '偏離最大的幾包。「採信」低於 100% 代表這一筆偏離行情太遠，' +
        '穩健回歸自動降低了它的發言權 —— 可能是辨識打錯了，也可能是真的超級促銷。紀錄本身完整保留。'
      : '偏離最大的幾包。正值代表模型認為它超值，負值代表它比行情貴。落差特別大的通常是輸入打錯了。';

    var sec = h('section', { class: 'section' },
      h('div', { class: 'section-head' },
        h('div', { class: 'section-title', text: '擬合診斷' }),
        h('div', { class: 'section-note', text: WR_SOLVER.methodInfo(m.method).label +
          ' · R² ' + (m.fit.r2 === null ? '—' : m.fit.r2.toFixed(3)) })),
      h('div', { class: 'section-note', text: blurb }),
      h('div', { class: 'card' }, h('div', { class: 'table-wrap' }, table)));

    if (m.excluded && m.excluded.length) sec.appendChild(excludedCard(m));
    return sec;
  }

  /** 被更便宜的同物品單品壓過、因此沒有參與求解的那些。 */
  function excludedCard(m) {
    var list = h('div', { class: 'card', style: 'margin-top:10px' });
    m.excluded.forEach(function (e) {
      list.appendChild(h('div', { class: 'lock-row' },
        h('div', { class: 'lock-info' },
          h('div', { class: 'lock-name', text: e.name || '（未命名）' }),
          h('div', { class: 'lock-est', text: '每' + (WR_CATALOG.perLabel(e.itemId) || '1') + ' ' +
            dPrice(e.itemId, e.unitPrice) + ' 元，比「' + (e.bestName || '另一筆') + '」貴 ' + pct(e.overpay) })),
        h('span', { class: 'pill conf-low' }, '未納入')));
    });
    return h('div', null,
      h('div', { class: 'section-note', style: 'margin-top:14px',
        text: '這些單品包有更便宜的同物品選擇，所以不拿來決定基準單價 —— 基準單價代表「你買得到的最好價格」。' }),
      list);
  }

  /* ====================================================================
     禮包清單
     ==================================================================== */

  function renderBundles() {
    var root = $('viewBundles');
    clear(root);

    if (!state.bundles.length) {
      root.appendChild(emptyState(
        '還沒有禮包紀錄',
        '把商城裡看到的禮包一筆筆記下來：售價加上內容物。累積越多，單價推算就越準。',
        '新增禮包', function () { openEditor(null); }
      ));
      root.appendChild(h('div', { style: 'display:flex; justify-content:center' },
        h('button', { class: 'btn btn-ghost btn-sm', onclick: loadSample }, '或先載入範例資料看看')));
      return;
    }

    var byId = {};
    if (state.model) {
      state.model.fit.predictions.forEach(function (p) { byId[p.id] = p; });
    }

    root.appendChild(filterBar());

    var shown = applyFilter(state.bundles);
    var list = h('div', null);
    shown.forEach(function (b) { list.appendChild(bundleCard(b, byId[b.id])); });

    var f = state.filter;
    var title = f.items.length
      ? shown.length + ' / ' + state.bundles.length + ' 筆'
      : state.bundles.length + ' 筆紀錄';

    var body = shown.length
      ? list
      : h('div', { class: 'card card-pad' }, h('div', { class: 'ed-empty', style: 'padding:14px 4px' },
        '沒有同時包含這些物品的禮包。'));

    root.appendChild(h('section', { class: 'section' },
      h('div', { class: 'section-head' },
        h('div', { class: 'section-title', text: title }),
        h('div', { class: 'section-note', text: '點任一筆即可編輯' })),
      body));
  }

  /**
   * 篩選：選幾個物品，只留「同時包含」這些物品的禮包。
   *
   * 用 AND 而不是 OR，因為這個功能的實際用途是「我想看以前有沒有出過類似的包」——
   * 選了白金又選了金幣，想找的是兩者都有的那種組合包，不是兩者任一。
   */
  function applyFilter(bundles) {
    var f = state.filter;
    var out = bundles.filter(function (b) {
      for (var i = 0; i < f.items.length; i++) {
        if (!(b.qty && b.qty[f.items[i]] > 0)) return false;
      }
      return true;
    });

    var pred = {};
    if (state.model) state.model.fit.predictions.forEach(function (p) { pred[p.id] = p; });

    return out.sort(function (a, b) {
      if (f.sort === 'price') return (b.price || 0) - (a.price || 0);
      if (f.sort === 'ratio') {
        var ra = pred[a.id] && pred[a.id].ratio !== null ? pred[a.id].ratio : -1;
        var rb = pred[b.id] && pred[b.id].ratio !== null ? pred[b.id].ratio : -1;
        return rb - ra;
      }
      return String(b.date || '').localeCompare(String(a.date || ''));
    });
  }

  var SORTS = [
    { id: 'date', label: '最新' },
    { id: 'price', label: '售價' },
    { id: 'ratio', label: '性價比' }
  ];

  function filterBar() {
    var f = state.filter;

    // 只列出真的出現過的物品 —— 給一排永遠點不出東西的丸子沒有意義。
    var seen = {};
    state.bundles.forEach(function (b) {
      for (var id in (b.qty || {})) {
        if (Object.prototype.hasOwnProperty.call(b.qty, id) && b.qty[id] > 0) {
          seen[id] = (seen[id] || 0) + 1;
        }
      }
    });
    var ids = WR_CATALOG.IDS.filter(function (id) { return seen[id]; });

    var chips = h('div', { class: 'chips' });
    ids.forEach(function (id) {
      var on = f.items.indexOf(id) >= 0;
      chips.appendChild(h('button', {
        class: 'chip',
        'aria-pressed': on ? 'true' : 'false',
        onclick: function () {
          var at = f.items.indexOf(id);
          if (at >= 0) f.items.splice(at, 1); else f.items.push(id);
          render();
        }
      }, WR_CATALOG.labelOf(id), h('span', { class: 'chip-qty', text: String(seen[id]) })));
    });

    var sorts = h('div', { class: 'seg' });
    SORTS.forEach(function (s) {
      sorts.appendChild(h('button', {
        class: state.filter.sort === s.id ? 'on' : '',
        onclick: function () { state.filter.sort = s.id; render(); }
      }, s.label));
    });

    var head = h('div', { class: 'section-head' },
      h('div', { class: 'section-title', text: '找禮包' }),
      f.items.length
        ? h('button', { class: 'btn btn-sm btn-ghost', onclick: function () { f.items = []; render(); } }, '清除篩選')
        : null);

    return h('section', { class: 'section' }, head,
      h('div', { class: 'card card-pad', style: 'display:flex; flex-direction:column; gap:11px' },
        chips,
        h('div', { style: 'display:flex; align-items:center; gap:10px; flex-wrap:wrap' },
          h('span', { class: 'section-note', style: 'margin:0', text: '排序' }), sorts)));
  }

  function bundleCard(b, pred) {
    var items = Object.keys(b.qty || {});
    var card = h('div', { class: 'bundle', 'data-disabled': b.enabled === false ? 'true' : 'false', tabindex: '0', role: 'button',
      onclick: function () { openEditor(b); },
      onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEditor(b); } }
    });

    card.appendChild(h('div', { class: 'bundle-top' },
      h('div', null,
        h('div', { class: 'bundle-name', text: b.name || '（未命名禮包）' }),
        h('div', { class: 'bundle-date', text: [b.date, b.enabled === false ? '已停用' : null].filter(Boolean).join(' · ') })),
      h('div', { class: 'bundle-price num' }, h('span', { class: 'cur', text: 'NT$' }), group(Math.round(b.price)))
    ));

    if (items.length) {
      card.appendChild(h('div', { class: 'bundle-items' }, items.map(function (id) {
        return h('span', { class: 'tag' }, WR_CATALOG.labelOf(id), h('b', { text: fmtQty(b.qty[id]) }));
      })));
    }

    // 資料健檢：每單位價格明顯高於同物品其他筆 —— 最可能的原因是數量少看一位。
    var suspect = state.model && state.model.suspects
      ? state.model.suspects.filter(function (s) { return s.id === b.id; })[0] : null;
    if (suspect) {
      card.appendChild(h('div', { class: 'bundle-foot' },
        h('span', { class: 'pill conf-none' }, h('span', { class: 'ico', svg: ICON.alert }), '可能打錯了'),
        h('span', { text: dUnit(suspect.itemId).replace('元 / ', '每') + ' ' +
          dPrice(suspect.itemId, suspect.unitPrice) + ' 元，但你記過的同物品是 ' +
          dPrice(suspect.itemId, suspect.median) + ' 元（' + suspect.samples + ' 筆）' })));
    }

    if (pred && pred.excluded) {
      // 被更便宜的同物品單品壓過 —— 紀錄留著，但不拿來決定基準單價。
      card.appendChild(h('div', { class: 'bundle-foot' },
        h('span', { class: 'pill conf-low' }, h('span', { class: 'dot' }), '未納入推算'),
        h('span', { text: '有更便宜的「' + (pred.excludedBy || '同類禮包') + '」' })));
    } else if (pred) {
      var off = pred.ratio - 1;
      var tone = Math.abs(off) < 0.1 ? 'conf-mid' : (off > 0 ? 'conf-high' : 'conf-low');
      var foot = h('div', { class: 'bundle-foot' },
        h('span', { class: 'pill ' + tone }, h('span', { class: 'dot' }),
          '性價比 ' + pred.ratio.toFixed(2)),
        h('span', { text: '模型估值 ' + fmtMoney(pred.predicted) + ' 元' }));
      if (pred.weight !== undefined && pred.weight < 0.75) {
        // 降權有兩個方向，講法完全不同：
        // 比行情好太多 = 這是好貨，只是不拿它當「一般行情」的樣本
        // 比行情差太多 = 這筆要嘛很坑，要嘛是輸入打錯了
        var better = pred.ratio > 1;
        foot.appendChild(h('span', { style: 'color:var(--' + (better ? 'good' : 'serious') + '-ink)',
          text: better
            ? '· 划算得超出行情，未納入平均'
            : '· 比行情貴得多，未納入平均' }));
      }
      card.appendChild(foot);
    }

    return card;
  }

  /* ====================================================================
     禮包編輯器

     舊版用兩層彈窗：點「新增」開面板，點售價又開一層鍵盤面板，選完關掉，
     捲下去找物品，點一下又開一層，關掉之後剛加的東西已經被捲出畫面。
     改成整頁 + 常駐鍵盤：你正在建的東西一直看得見，鍵盤永遠在同一個位置，
     打的字進到哪一格由「焦點」決定，從頭到尾不會有東西彈出來又消失。
     ==================================================================== */

  var pad = {
    draft: null,
    target: null,     // 'price' 或物品 id
    buffer: '',
    mode: 'bundle',   // 'bundle' = 存成禮包；'draft' = 試算用的組合
    showAll: false,
    refs: {}
  };

  function openEditor(bundle, mode) {
    pad.mode = mode || 'bundle';
    pad.showAll = false;
    pad.draft = pad.mode === 'draft'
      ? { name: state.draft.name, price: state.draft.price, qty: cloneQty(state.draft.qty), enabled: true }
      : (bundle
        ? { id: bundle.id, name: bundle.name, price: bundle.price, qty: cloneQty(bundle.qty), note: bundle.note, enabled: bundle.enabled !== false }
        : { id: null, name: '', price: null, qty: {}, note: '', enabled: true });

    $('editorTitle').textContent = pad.mode === 'draft' ? '要評估的組合'
      : (bundle ? '編輯禮包' : '新增禮包');
    $('editorSave').textContent = pad.mode === 'draft' ? '完成' : '儲存';

    // 一開啟就把焦點放在售價，使用者可以直接開始打，不必先點一下。
    pad.target = 'price';
    pad.buffer = pad.draft.price ? String(pad.draft.price) : '';

    renderEditor();
    $('editor').hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closeEditor() {
    $('editor').hidden = true;
    document.body.style.overflow = '';
    pad.draft = null;
    pad.target = null;
  }

  /** 數量 0 的物品只在編輯當下留著（方便你刪光重打），離開時要清掉。 */
  function strippedQty(qty) {
    var out = {};
    for (var id in qty) {
      if (Object.prototype.hasOwnProperty.call(qty, id) && qty[id] > 0) out[id] = qty[id];
    }
    return out;
  }

  function padFocus(target) {
    // 換焦點時，上一個沒填數量的物品就順手移除，不留空列。
    if (pad.target && pad.target !== 'price' && !(pad.draft.qty[pad.target] > 0)) {
      delete pad.draft.qty[pad.target];
    }
    pad.target = target;
    pad.buffer = target === 'price'
      ? (pad.draft.price ? String(pad.draft.price) : '')
      : WR_CATALOG.toInputValue(target, pad.draft.qty[target]);
    renderEditor();
  }

  /** 目前這一格是不是用縮放單位輸入（例如銀幣打 2.5 代表 2.5M）。 */
  function padScale() {
    return pad.target && pad.target !== 'price' ? WR_CATALOG.inputScaleOf(pad.target) : 1;
  }

  function padUnit() {
    return pad.target && pad.target !== 'price' ? WR_CATALOG.inputUnitOf(pad.target) : '';
  }

  function padKey(key) {
    if (!pad.target) return;
    if (key === 'back') {
      pad.buffer = pad.buffer.slice(0, -1);
    } else if (key === 'clear') {
      pad.buffer = '';
    } else if (key === '.') {
      if (padScale() === 1 || pad.buffer.indexOf('.') >= 0) return;
      pad.buffer = (pad.buffer === '' ? '0' : pad.buffer) + '.';
    } else {
      if (pad.buffer === '0') pad.buffer = '';
      var dot = pad.buffer.indexOf('.');
      // 小數點後三位就是 1000 銀幣，再細沒有意義
      if (dot >= 0 && pad.buffer.length - dot - 1 + key.length > 3) return;
      if (pad.buffer.length + key.length <= 12) pad.buffer += key;
    }
    padCommit();
  }

  function padQuick(value) {
    pad.buffer = pad.target === 'price' ? String(value) : WR_CATALOG.toInputValue(pad.target, value);
    padCommit();
  }

  /** 把 buffer 寫回 draft，並只更新畫面上會變的那幾個字，不整頁重畫。 */
  function padCommit() {
    if (pad.target === 'price') {
      var v = pad.buffer === '' ? 0 : Number(pad.buffer);
      if (!isFinite(v)) v = 0;
      pad.draft.price = v > 0 ? v : null;
      if (pad.refs.price) {
        pad.refs.price.textContent = v > 0 ? group(v) : '0';
        pad.refs.price.className = 'val' + (v > 0 ? '' : ' is-empty');
      }
    } else {
      var qty = WR_CATALOG.fromInputValue(pad.target, pad.buffer);
      pad.draft.qty[pad.target] = qty;
      var ref = pad.refs.rows[pad.target];
      if (ref) {
        // 打到一半顯示使用者正在打的字，不要跳成換算後的完整數字，
        // 否則打「2.」的瞬間會看到 2,000,000 然後又變 2,500,000，很干擾。
        ref.qty.textContent = padDisplayQty(pad.target, qty, true);
        ref.sub.textContent = rowSubtitle(pad.target, qty);
      }
    }
    paintTotal();
  }

  /** 焦點在這一格時顯示正在打的字＋單位；否則顯示換算後的數量。 */
  function padDisplayQty(id, qty, focused) {
    var unit = WR_CATALOG.inputUnitOf(id);
    // 單位一定要跟著數字，不然「2.5」會被讀成 2.5 枚銀幣而不是 250 萬。
    if (focused && unit) return (pad.buffer || '0') + ' ' + unit;
    if (unit) return (WR_CATALOG.toInputValue(id, qty) || '0') + ' ' + unit;
    return group(qty || 0);
  }

  function rowSubtitle(id, qty) {
    var unit = WR_CATALOG.inputUnitOf(id);
    var prefix = unit ? '單位 ' + unit + ' · ' : '';
    var est = state.model && state.model.prices[id];
    if (!est || !(qty > 0)) return prefix + dUnit(id).replace('元 / ', '每 ') + ' —';
    return prefix + dUnit(id).replace('元 / ', '每 ') + ' ' + dPrice(id, est) +
      ' 元 · 小計 ' + fmtMoney(qty * est) + ' 元';
  }

  /**
   * 編輯器底部那條「邊打邊看的四個答案」。
   *
   * 舊版只印一個理論價值 —— 但那個數字取決於看板現在剛好選了哪種算法，
   * 而使用者在這裡正在做的是一個決定（這包要不要買），看單一算法的一句話不夠。
   * 四個並排唯一的成本是「先把四個模型建好」，之後每按一鍵都是現成的。
   *
   * 這個函式每按一個數字就會跑一次，所以裡面不准出現建模型這種等級的工作。
   */
  function paintTotal() {
    var host = pad.refs.total;
    if (!host) return;
    clear(host);

    var qty = strippedQty(pad.draft.qty);
    var price = pad.draft.price || 0;
    if (!Object.keys(qty).length || !state.model || !state.model.bundleCount) {
      host.appendChild(h('div', { class: 'ed-vwait', text: '還沒有基準單價可以估算' }));
      return;
    }

    var candidate = { qty: qty, price: price };
    var ready = ensureCompare('editor', function () { if (pad.draft) paintTotal(); });

    host.appendChild(h('div', { class: 'ed-verdicts-head' },
      h('span', { text: '預估價錢 / 性價比' }),
      h('em', { text: price > 0 ? '售價 NT$' + group(price) : '還沒填售價' })));

    // 模型還在建的這幾十毫秒，先用看板那一個算法頂著 —— 總比整塊空白好。
    if (!ready) {
      var one = WR_EVAL.evaluate(candidate, state.model);
      host.appendChild(h('div', { class: 'ed-vwait', text:
        fmtMoney(one.value) + ' 元' +
        (one.ratio === null ? '' : ' · 性價比 ' + one.ratio.toFixed(2)) +
        (compareBroken() ? '（四種算法算不出來：' + compareError.message + '）' : '（四種算法計算中…）') }));
      return;
    }

    var rows = WR_COMPARE.rows(candidate, state.compare.variants, state.model);
    var algos = rows.filter(function (r) { return !r.isRef; });
    var ref = rows.filter(function (r) { return r.isRef; })[0];

    var grid = h('div', { class: 'ed-vgrid',
      style: 'grid-template-columns: repeat(' + Math.max(1, algos.length) + ', minmax(0, 1fr))' });
    algos.forEach(function (r) {
      grid.appendChild(h('div', {
        class: 'ed-v', 'data-current': r.key === state.settings.method ? 'true' : 'false'
      },
        h('div', { class: 'ed-v-name', text: r.short }),
        h('div', { class: 'ed-v-ratio tone-' + (r.tier ? r.tier.tone : 'neutral'),
          text: r.ratio === null ? '—' : r.ratio.toFixed(2) }),
        h('div', { class: 'ed-v-money', text: fmtMoney(r.value) + ' 元' })));
    });
    host.appendChild(grid);

    if (ref) {
      host.appendChild(h('div', { class: 'ed-vref' },
        h('span', { text: '行情參考' }),
        h('span', null,
          h('b', { text: moneyRange(ref.valueLow, ref.valueHigh) + ' 元' }),
          ref.ratio === null ? null : h('span', { text: ' · 指數 ' + ratioRange(ref) }))));
    }
  }

  function renderEditor() {
    var body = $('editorBody');
    clear(body);
    pad.refs = { rows: {} };
    var d = pad.draft;

    // 售價
    var priceVal = h('span', { class: 'val' + (d.price ? '' : ' is-empty'), text: d.price ? group(d.price) : '0' });
    pad.refs.price = priceVal;
    body.appendChild(h('div', { class: 'field' },
      h('div', { class: 'ed-label' }, '售價'),
      h('button', {
        class: 'ed-price', 'data-focus': pad.target === 'price' ? 'true' : 'false',
        onclick: function () { padFocus('price'); }
      }, h('span', { class: 'cur', text: 'NT$' }), priceVal)));

    // 內容物
    var ids = WR_CATALOG.IDS.filter(function (id) {
      return d.qty[id] > 0 || (pad.target === id && d.qty[id] !== undefined);
    });
    var card = h('div', { class: 'slot-card' });
    if (!ids.length) {
      card.appendChild(h('div', { class: 'ed-empty', text: '點下面的物品加進來' }));
    } else {
      ids.forEach(function (id) {
        var qtyNode = h('span', { class: 'ed-row-qty',
          text: padDisplayQty(id, d.qty[id], pad.target === id) });
        var subNode = h('div', { class: 'ed-row-sub', text: rowSubtitle(id, d.qty[id]) });
        pad.refs.rows[id] = { qty: qtyNode, sub: subNode };
        card.appendChild(h('div', {
          class: 'ed-row', 'data-focus': pad.target === id ? 'true' : 'false',
          onclick: function (e) { if (!e.target.closest('.ed-row-x')) padFocus(id); }
        },
          h('div', { style: 'min-width:0' },
            h('div', { class: 'ed-row-name', text: WR_CATALOG.labelOf(id) }),
            subNode),
          qtyNode,
          h('button', {
            class: 'ed-row-x', 'aria-label': '移除 ' + WR_CATALOG.labelOf(id), svg: ICON.close,
            onclick: function () {
              delete d.qty[id];
              if (pad.target === id) { pad.target = 'price'; pad.buffer = d.price ? String(d.price) : ''; }
              renderEditor();
            }
          })));
      });
    }
    var total = h('div', { class: 'ed-verdicts' });
    pad.refs.total = total;
    if (ids.length) card.appendChild(total);
    body.appendChild(h('div', { class: 'field' }, h('div', { class: 'ed-label' }, '內容物'), card));
    paintTotal();

    // 加入物品：預設只放常用的，其餘收在「更多」後面
    var picker = h('div', { class: 'chips' });
    var list = pad.showAll
      ? WR_CATALOG.commonItems().concat(WR_CATALOG.restItems())
      : WR_CATALOG.commonItems();
    list.forEach(function (item) {
      var active = d.qty[item.id] > 0;
      picker.appendChild(h('button', {
        class: 'chip', 'aria-pressed': active ? 'true' : 'false',
        onclick: function () {
          if (d.qty[item.id] === undefined) d.qty[item.id] = 0;
          padFocus(item.id);
        }
      }, item.name, active ? h('span', { class: 'chip-qty', text: fmtQty(d.qty[item.id]) }) : null));
    });

    var addField = h('div', { class: 'field' },
      h('div', { class: 'ed-label' }, '加入物品'),
      picker);
    if (!pad.showAll) {
      addField.appendChild(h('button', {
        class: 'ed-more', onclick: function () { pad.showAll = true; renderEditor(); }
      }, '更多 ' + WR_CATALOG.restItems().length + ' 項 ▾'));
    }
    body.appendChild(addField);

    // 名稱與其他選項：放在最後，因為它們可以完全不填
    if (pad.mode === 'bundle') {
      body.appendChild(h('div', { class: 'field' },
        h('div', { class: 'ed-label' }, '名稱', h('em', { text: '留空會自動命名' })),
        h('input', {
          class: 'field-input', type: 'text', id: 'edName',
          placeholder: autoName(d) || '例如：週末特惠包', value: d.name || '',
          oninput: function (e) { d.name = e.target.value; }
        })));

      body.appendChild(h('div', { class: 'setting-row', style: 'border:1px solid var(--line); border-radius:var(--radius)' },
        h('div', { class: 'setting-info' },
          h('div', { class: 'setting-name', text: '納入推算' }),
          h('div', { class: 'setting-desc', text: '關掉的話這筆會保留，但不影響單價計算。' })),
        h('label', { class: 'switch' },
          h('input', { type: 'checkbox', checked: d.enabled ? true : null,
            onchange: function (e) { d.enabled = e.target.checked; } }),
          h('span'))));

      if (d.id) {
        body.appendChild(h('button', { class: 'btn btn-danger btn-block', onclick: deleteCurrent },
          h('span', { svg: ICON.trash }), '刪除這筆'));
      }
    }

    renderPad();
  }

  /** 沒取名字的話，用內容物自動組一個，省掉打字。 */
  function autoName(d) {
    var ids = WR_CATALOG.IDS.filter(function (id) { return d.qty[id] > 0; });
    if (!ids.length) return '';
    return ids.slice(0, 2).map(function (id) {
      return WR_CATALOG.nameOf(id) + ' ' + fmtQty(d.qty[id]);
    }).join(' + ') + (ids.length > 2 ? ' 等' : '');
  }

  function renderPad() {
    var el = $('editorPad');
    clear(el);
    el.setAttribute('data-active', pad.target ? 'true' : 'false');

    var inner = h('div', { class: 'pad-inner' });
    var targetName = pad.target === 'price' ? '售價'
      : (pad.target ? WR_CATALOG.labelOf(pad.target) + ' 的數量' +
          (padUnit() ? '（單位 ' + padUnit() + '）' : '') : '');
    inner.appendChild(h('div', { class: 'pad-hint' },
      h('span', null, '正在輸入：', h('b', { text: targetName || '—' })),
      h('button', { class: 'btn btn-sm btn-ghost', onclick: function () { padKey('clear'); } }, '清除')));

    var steps = pad.target === 'price'
      ? WR_CATALOG.PRICE_STEPS
      : (pad.target ? (WR_CATALOG.get(pad.target) || {}).steps || [] : []);
    var quick = h('div', { class: 'pad-quick' });
    var unit = padUnit();
    steps.forEach(function (n) {
      var label = pad.target === 'price' ? group(n)
        : (unit ? WR_CATALOG.toInputValue(pad.target, n) + ' ' + unit : group(n));
      quick.appendChild(h('button', { onclick: function () { padQuick(n); } }, label));
    });
    inner.appendChild(quick);

    var grid = h('div', { class: 'pad-grid' });
    ['1', '2', '3', '4', '5', '6', '7', '8', '9'].forEach(function (n) {
      grid.appendChild(h('button', { text: n, onclick: function () { padKey(n); } }));
    });
    // 打 M 為單位時 000 沒有意義（不會有人打 2000M），改給小數點。
    grid.appendChild(padScale() > 1
      ? h('button', { class: 'k-util', text: '.', onclick: function () { padKey('.'); } })
      : h('button', { class: 'k-util', text: '000', onclick: function () { padKey('000'); } }));
    grid.appendChild(h('button', { text: '0', onclick: function () { padKey('0'); } }));
    grid.appendChild(h('button', { class: 'k-util', 'aria-label': '刪除一位', svg: ICON.backspace,
      onclick: function () { padKey('back'); } }));
    inner.appendChild(grid);

    el.appendChild(inner);
  }

  function saveEditor() {
    var d = pad.draft;
    if (!d) return;
    var qty = strippedQty(d.qty);

    if (pad.mode === 'draft') {
      state.draft = { name: d.name || '', price: d.price, qty: qty };
      closeEditor();
      render();
      return;
    }

    if (!(d.price > 0)) { toast('請先輸入售價'); padFocus('price'); return; }
    if (!Object.keys(qty).length) { toast('至少要加入一項物品'); return; }

    var payload = {
      id: d.id, name: d.name || autoName(d), price: d.price,
      qty: qty, note: d.note, enabled: d.enabled
    };
    var isNew = !d.id;
    closeEditor();
    busy(true);
    WRBridge.call('saveBundle', payload).then(function (res) {
      state.bundles = res.bundles;
      recompute();
      render();
      toast(isNew ? '已新增禮包' : '已更新');
    }).catch(failed).then(function () { busy(false); });
  }

  function deleteCurrent() {
    var d = pad.draft;
    if (!d || !d.id) return;
    if (!window.confirm('確定要刪除「' + (d.name || '未命名禮包') + '」嗎？')) return;
    closeEditor();
    busy(true);
    WRBridge.call('deleteBundle', d.id).then(function (res) {
      state.bundles = res.bundles;
      recompute();
      render();
      toast('已刪除');
    }).catch(failed).then(function () { busy(false); });
  }

  function cloneQty(q) {
    var out = {};
    for (var k in q) if (Object.prototype.hasOwnProperty.call(q, k)) out[k] = q[k];
    return out;
  }

  /* ====================================================================
     性價比試算
     ==================================================================== */

  function renderEvaluate() {
    var root = $('viewEvaluate');
    clear(root);
    var m = state.model;

    if (!m || m.bundleCount === 0) {
      root.appendChild(emptyState(
        '需要先有基準單價',
        '試算器會用歷史禮包解出的單價來估算新組合的理論價值。先記幾筆禮包吧。',
        '去新增禮包', function () { go('bundles'); openEditor(null); }
      ));
      return;
    }

    var d = state.draft;
    var qty = WR_CATALOG.IDS.filter(function (id) { return d.qty[id] > 0; });
    var ready = d.price > 0 && qty.length > 0;

    // 輸入一律走同一個編輯器，全 app 只有一個輸入介面要學。
    var summary = h('div', { class: 'card card-pad', style: 'display:flex; flex-direction:column; gap:12px' });
    if (ready) {
      summary.appendChild(h('div', { style: 'display:flex; align-items:baseline; justify-content:space-between; gap:12px' },
        h('div', { class: 'num', style: 'font-size:26px; font-weight:700; letter-spacing:-0.03em' },
          h('span', { style: 'font-size:12px; color:var(--ink-3); margin-right:4px', text: 'NT$' }),
          group(d.price)),
        h('button', { class: 'btn btn-sm', onclick: function () { openEditor(null, 'draft'); } }, '編輯')));
      summary.appendChild(h('div', { class: 'bundle-items' }, qty.map(function (id) {
        return h('span', { class: 'tag' }, WR_CATALOG.labelOf(id), h('b', { text: fmtQty(d.qty[id]) }));
      })));
    } else {
      summary.appendChild(h('div', { class: 'ed-empty', style: 'padding:14px 4px' },
        '輸入售價和內容物，就會即時算出性價比'));
      summary.appendChild(h('button', {
        class: 'btn btn-primary btn-block', onclick: function () { openEditor(null, 'draft'); }
      }, h('span', { svg: ICON.plus }), '建立要評估的組合'));
    }

    root.appendChild(h('section', { class: 'section' },
      h('div', { class: 'section-head' },
        h('div', { class: 'section-title', text: '要評估的組合' }),
        ready ? h('button', { class: 'btn btn-sm btn-ghost', onclick: function () {
          state.draft = { name: '', price: null, qty: {} };
          render();
        } }, '清空') : null),
      summary));

    if (!ready) return;

    var ev = WR_EVAL.evaluate({ qty: d.qty, price: d.price }, m);
    root.appendChild(verdictCard(ev));
    root.appendChild(methodsCard({ qty: d.qty, price: d.price }));
    root.appendChild(compareCard(ev));
    if (ev.contributions.length) root.appendChild(contributionCard(ev));
    if (ev.unpriced.length) {
      root.appendChild(h('div', { class: 'notice notice-warn' },
        h('span', { class: 'ico', svg: ICON.alert }),
        h('span', { text: '這些物品還沒有基準單價，沒有被算進理論價值：' +
          ev.unpriced.map(function (u) { return u.label; }).join('、') + '。先記一筆含有它們的禮包就會出現。' })));
    }
    root.appendChild(h('button', { class: 'btn btn-block', onclick: function () { logEvaluation(ev); } },
      h('span', { svg: ICON.sync }), '存進試算紀錄'));
  }

  function verdictCard(ev) {
    var tier = ev.tier;
    var card = h('div', { class: 'verdict tone-' + tier.tone });
    var icons = { good: ICON.check, neutral: ICON.equal, warning: ICON.minus, critical: ICON.alert };

    card.appendChild(h('div', { class: 'verdict-top' },
      h('div', { class: 'verdict-figure' },
        h('div', { class: 'verdict-label', text: '性價比指數' }),
        h('div', { class: 'verdict-value num', text: ev.ratio.toFixed(2) }),
        ev.ratioLow !== null
          ? h('div', { class: 'verdict-range', text: '可能區間 ' + ev.ratioLow.toFixed(2) + ' – ' + ev.ratioHigh.toFixed(2) })
          : null,
        // 指數是個比值，光看比值不知道在講多少錢。預估價錢放在同一塊，
        // 「值 612 元但賣你 500」跟「1.22」是同一句話的兩種說法。
        h('div', { class: 'verdict-range', text: '預估價錢 ' + fmtMoney(ev.value) + ' 元 · 售價 ' + fmtMoney(ev.price) + ' 元' })),
      h('div', { class: 'badge' }, h('span', { class: 'ico', svg: icons[tier.tone] }), tier.label)
    ));

    var lines = [tier.blurb + '（正常行情視為 ' + (1 - ev.band).toFixed(2) + ' – ' + (1 + ev.band).toFixed(2) + '，寬度取自模型自身的平均誤差）'];
    if (ev.rank && ev.rank.total >= 3) {
      lines.push('在你記錄的 ' + ev.rank.total + ' 筆禮包裡，它比其中 ' + ev.rank.beats + ' 筆划算。');
    }
    if (ev.confidenceCoverage < 0.6) {
      lines.push('注意：理論價值裡只有 ' + pct(ev.confidenceCoverage) + ' 來自高信心的單價，這個結論還不夠穩。');
    }
    card.appendChild(h('div', { class: 'verdict-blurb', text: lines.join(' ') }));
    return card;
  }

  /* --------------------------------------------------------------
     四種算法並排：預估價錢 × 性價比

     重點不是挑出「最準的那個」—— 而是看結論穩不穩。四個都說超值，
     那個判斷就跟算法怎麼選無關；彼此打架，代表結論是假設撐起來的，
     該去多記幾包而不是照著買。

     每一列都同時給「預估價錢」與「性價比」，因為只看指數會漏掉一件事：
     兩種算法可以給出一模一樣的指數，卻是用差很多的價值估出來的。

     舊版要按一下按鈕才算。那個按鈕存在的唯一理由是「建模型要花半秒」，
     但代價是多數人根本沒按過，等於四種算法白寫了 —— 現在改成一進來就排進
     下一個 tick 自己算，這一輪先畫「計算中」，算完自己重畫。
     -------------------------------------------------------------- */

  function methodsCard(candidate) {
    var sec = h('section', { class: 'section' },
      h('div', { class: 'section-head' },
        h('div', { class: 'section-title', text: '四種算法怎麼說' }),
        h('div', { class: 'section-note', text: '同一包、同一批禮包，各算一次' })));

    if (!ensureCompare('view', render)) {
      sec.appendChild(h('div', { class: 'card card-pad' },
        h('div', { class: 'ed-empty', style: 'padding:18px 4px',
          text: compareBroken() ? '四種算法算不出來：' + compareError.message : '四種算法計算中…' })));
      return sec;
    }

    var rows = WR_COMPARE.rows(candidate, state.compare.variants, state.model);
    var algos = rows.filter(function (r) { return !r.isRef; });
    var ref = rows.filter(function (r) { return r.isRef; })[0];

    var card = h('div', { class: 'card', style: 'overflow:hidden' });
    card.appendChild(h('div', { class: 'mtx-head' },
      h('span', { text: '算法' }), h('span', { text: '預估價錢' }), h('span', { text: '性價比' })));
    rows.forEach(function (r) { card.appendChild(methodRow(r, candidate.price)); });
    sec.appendChild(card);

    // 一致性只看四種算法。行情參考不是算法，把它算進共識等於讓
    // 「使用者自己填的數字」去投票決定「資料說了什麼」。
    var con = WR_COMPARE.consensus(algos);
    sec.appendChild(h('div', { class: 'notice' + (con.level === 'weak' ? ' notice-warn' : '') },
      h('span', { class: 'ico', svg: con.level === 'weak' ? ICON.alert : ICON.check }),
      h('span', { text: con.text })));

    if (ref && ref.ref.coverage < 0.999) {
      sec.appendChild(h('div', { class: 'notice' },
        h('span', { class: 'ico', svg: ICON.alert }),
        h('span', { text: '行情參考那一列有 ' + pct(1 - ref.ref.coverage) + ' 的價值是用解出來的單價補上的 —— ' +
          ref.ref.filled.map(function (f) { return f.label; }).join('、') +
          ' 沒有行情參考價（資料卡的價值取決於開出什麼，本來就沒有公定行情）。' })));
    }

    // 貝氏的區間通常明顯比其他三個寬，那不是它比較差，而是另外三個低估了。
    var bayes = algos.filter(function (r) { return r.key === 'bayes'; })[0];
    if (bayes && bayes.ratioLow !== null) {
      var widest = 0;
      algos.forEach(function (r) {
        if (r.key !== 'bayes' && r.ratioLow !== null) widest = Math.max(widest, r.ratioHigh - r.ratioLow);
      });
      var mine = bayes.ratioHigh - bayes.ratioLow;
      if (widest > 0 && mine > widest * 1.8) {
        sec.appendChild(h('div', { class: 'section-note', text:
          '完整貝氏的區間明顯比其他三個寬。那不是它算得比較差 —— 重抽法在「資料本來就分不出來」的情況下' +
          '每次都會收斂到同一個答案，於是區間很窄，但那個穩定是假的。這裡寬的那個才是誠實的。' }));
      }
    }

    // 每一種在做什麼：需要的時候才讀，不要每次打開都擋在數字前面。
    sec.appendChild(h('button', {
      class: 'notice notice-toggle', 'aria-expanded': state.showMethodNotes ? 'true' : 'false',
      onclick: function () { state.showMethodNotes = !state.showMethodNotes; render(); }
    },
      h('span', { class: 'ico', svg: ICON.tune }),
      h('span', { text: state.showMethodNotes ? '收起「每一種在做什麼」' : '每一種在做什麼？（點開看說明）' })));
    if (state.showMethodNotes) {
      rows.forEach(function (r) {
        sec.appendChild(h('div', { class: 'section-note', style: 'padding:2px 0' },
          h('b', { text: r.label + '：' }), r.blurb));
      });
    }
    return sec;
  }

  /** 矩陣裡的一列。行情參考那一列的數字是區間，所以兩欄都要能吃區間。 */
  function methodRow(r, price) {
    var tone = r.tier ? r.tier.tone : 'neutral';
    var row = h('div', { class: 'mtx-row' + (r.isRef ? ' mtx-row-ref' : '') });

    row.appendChild(h('div', { style: 'min-width:0' },
      h('div', { class: 'mtx-name' }, r.label,
        (!r.isRef && r.key === state.settings.method)
          ? h('span', { class: 'pill conf-high' }, h('span', { class: 'dot' }), '看板用這個') : null,
        r.isRef ? h('span', { class: 'pill pill-ref' }, '不參與計算') : null),
      h('div', { class: 'mtx-tip', text: r.tip })));

    // 每一格都是「大數字 + 一行小字」，兩欄五列共用同一個結構。
    // 行情參考那一列本來把整個區間塞進大數字，但 NT$4,206 – 5,008 在手機上
    // 會撐破固定欄寬、把整張表的對齊弄歪 —— 區間退到小字那一行，
    // 剛好跟右邊「指數 + 指數區間」的寫法一致。
    var gap = (price > 0 && r.value !== null) ? r.value - price : null;
    var span = r.isRef ? moneyRange(r.valueLow, r.valueHigh) : null;
    row.appendChild(h('div', { class: 'mtx-money' },
      h('span', null,
        h('span', { class: 'cur', text: 'NT$' }),
        h('b', { text: fmtMoney(r.value) })),
      r.isRef
        ? (span === fmtMoney(r.value) ? null : h('small', { text: span }))
        : (gap === null ? null
          : h('small', { text: (gap >= 0 ? '比售價多 ' : '比售價少 ') + fmtMoney(Math.abs(gap)) }))));

    row.appendChild(h('div', { class: 'mtx-ratio' },
      h('b', { class: 'tone-' + tone, text: r.ratio === null ? '—' : r.ratio.toFixed(2) }),
      r.ratioLow !== null && ratioRange(r) !== r.ratio.toFixed(2)
        ? h('small', { text: ratioRange(r) }) : null,
      r.tier ? h('span', { class: 'tier tone-' + tone, text: r.tier.label }) : null));

    return row;
  }

  function compareCard(ev) {
    var max = Math.max(ev.value, ev.price) || 1;
    var tone = ev.tier.tone;
    return h('section', { class: 'section' },
      h('div', { class: 'section-title', text: '理論價值 vs 售價' }),
      h('div', { class: 'card card-pad tone-' + tone },
        h('div', { class: 'compare' },
          h('div', { class: 'compare-row' },
            h('div', { class: 'compare-key', text: '理論價值' }),
            h('div', { class: 'compare-track' }, h('i', { class: 'bg-fill', style: 'width:' + (ev.value / max * 100) + '%' })),
            h('div', { class: 'compare-val', text: fmtMoney(ev.value) })),
          h('div', { class: 'compare-row' },
            h('div', { class: 'compare-key', text: '實際售價' }),
            h('div', { class: 'compare-track' }, h('i', { style: 'width:' + (ev.price / max * 100) + '%; background:var(--ink-3)' })),
            h('div', { class: 'compare-val', text: fmtMoney(ev.price) }))),
        h('div', { class: 'section-note', style: 'margin-top:11px',
          text: ev.value >= ev.price
            ? '照目前行情，這包大約值 ' + fmtMoney(ev.value) + ' 元，比標價多 ' + fmtMoney(ev.value - ev.price) + ' 元。'
            : '照目前行情，這包大約值 ' + fmtMoney(ev.value) + ' 元，比標價少 ' + fmtMoney(ev.price - ev.value) + ' 元。' })));
  }

  function contributionCard(ev) {
    // 只畫前 5 名，其餘併成「其他」—— 類別色超過 5 個就無法保證可辨識度。
    var top = ev.contributions.slice(0, 5);
    var rest = ev.contributions.slice(5);
    var restValue = rest.reduce(function (s, c) { return s + c.value; }, 0);

    var stack = h('div', { class: 'stack', role: 'img', 'aria-label': '價值組成' });
    top.forEach(function (c, i) {
      if (c.share > 0.005) stack.appendChild(h('i', { style: 'width:' + (c.share * 100) + '%; background:' + SERIES[i] }));
    });
    if (restValue > 0) {
      stack.appendChild(h('i', { style: 'width:' + (restValue / ev.value * 100) + '%; background:' + OTHER_COLOR }));
    }

    var legend = h('div', { class: 'legend' });
    top.forEach(function (c, i) {
      legend.appendChild(h('div', { class: 'legend-row' },
        h('span', { class: 'legend-swatch', style: 'background:' + SERIES[i] }),
        h('span', { class: 'legend-name' }, c.label,
          h('span', { text: fmtQty(c.qty) + ' 個 · ' + dUnit(c.id).replace('元 / ', '每 ') + ' ' +
            dPrice(c.id, c.unitPrice) + ' 元 · ' + (CONF_TEXT[c.confidence] || '') })),
        h('span', { class: 'legend-val', text: fmtMoney(c.value) }),
        h('span', { class: 'legend-share', text: pct(c.share) })));
    });
    if (restValue > 0) {
      legend.appendChild(h('div', { class: 'legend-row' },
        h('span', { class: 'legend-swatch', style: 'background:' + OTHER_COLOR }),
        h('span', { class: 'legend-name' }, '其他 ' + rest.length + ' 項'),
        h('span', { class: 'legend-val', text: fmtMoney(restValue) }),
        h('span', { class: 'legend-share', text: pct(restValue / ev.value) })));
    }

    return h('section', { class: 'section' },
      h('div', { class: 'section-head' },
        h('div', { class: 'section-title', text: '價值是誰撐起來的' }),
        h('div', { class: 'section-note', text: '共 ' + ev.contributions.length + ' 項' })),
      h('div', { class: 'card card-pad', style: 'display:flex; flex-direction:column; gap:13px' }, stack, legend));
  }

  function logEvaluation(ev) {
    var contents = ev.contributions.map(function (c) {
      return WR_CATALOG.labelOf(c.id) + ' ' + group(c.qty);
    }).join('、');

    // 只存看板那一個算法的結論，過幾天回頭看會不知道當時另外三個怎麼說，
    // 而「四個算法是不是一致」正是這筆紀錄最值錢的部分，所以一起寫進去。
    var methods = '';
    var reference = '';
    if (compareReady()) {
      var rows = WR_COMPARE.rows({ qty: state.draft.qty, price: ev.price }, state.compare.variants, state.model);
      methods = rows.filter(function (r) { return !r.isRef; }).map(function (r) {
        return r.short + ' ' + (r.ratio === null ? '—' : r.ratio.toFixed(2));
      }).join(' / ');
      var ref = rows.filter(function (r) { return r.isRef; })[0];
      if (ref) reference = moneyRange(ref.valueLow, ref.valueHigh) + ' 元 · 指數 ' + ratioRange(ref);
    }

    busy(true);
    WRBridge.call('logEvaluation', {
      name: state.draft.name || '試算組合',
      price: ev.price, value: ev.value, ratio: ev.ratio,
      verdict: ev.tier.label, contents: contents,
      methods: methods, reference: reference
    }).then(function () { toast('已存進試算紀錄'); }).catch(failed).then(function () { busy(false); });
  }

  /* ====================================================================
     設定
     ==================================================================== */

  function renderSettings() {
    var root = $('viewSettings');
    clear(root);
    var m = state.model;

    // 還沒有資料的時候，「資料要存在哪」才是第一件該決定的事；
    // 有資料之後，會常用的是鎖定單價，就把它放回最上面。
    var firstRun = !state.bundles.length;
    if (firstRun) append(root, dataSection());

    // 鎖定基準單價
    var lockList = h('div', { class: 'card' });
    var items = (m && m.items.length) ? m.items : [];
    if (!items.length) {
      lockList.appendChild(h('div', { class: 'empty' }, h('span', { text: '還沒有物品可以鎖定' })));
    } else {
      items.slice().sort(function (a, b) {
        return WR_CATALOG.IDS.indexOf(a.id) - WR_CATALOG.IDS.indexOf(b.id);
      }).forEach(function (it) {
        var given = Object.prototype.hasOwnProperty.call(state.priors, it.id);
        var pullText = '';
        if (it.priorRetired) {
          pullText = ' · 已自動退場，完全由資料決定';
        } else if (it.priorPull !== null) {
          pullText = it.priorPull > 0.1
            ? ' · 目前把結果拉動了 ' + pct(it.priorPull)
            : ' · 幾乎沒影響，資料已經夠了';
        }
        if (it.effectiveObs !== null && it.effectiveObs < it.occurrences * 0.5 && it.occurrences >= 3) {
          pullText = ' · 有效觀測僅 ' + it.effectiveObs.toFixed(1) + ' 次（跟別的物品綁在一起）' + pullText;
        }
        // 行情參考價直接印在同一列，填的時候不用再回去翻自己的筆記；
        // 它本身不會被送進引擎，所以只當提示，不當預設值。
        var refText = WR_CATALOG.hasRef(it.id) ? ' · 行情參考 ' + WR_CATALOG.formatRef(it.id) : '';
        lockList.appendChild(h('div', { class: 'lock-row' },
          h('div', { class: 'lock-info' },
            h('div', { class: 'lock-name', text: it.label }),
            h('div', { class: 'lock-est', text: '解出 ' + dPrice(it.id, it.price) + ' ' + dUnit(it.id) +
              refText + ' · 出現 ' + it.occurrences + ' 包' + pullText })),
          h('input', {
            class: 'lock-input', type: 'number', step: 'any', min: '0',
            'data-locked': given ? 'true' : 'false',
            'aria-label': it.label + ' 參考單價',
            placeholder: WR_CATALOG.hasRef(it.id) ? WR_CATALOG.formatRef(it.id) : '未填',
            value: given ? state.priors[it.id] : '',
            onchange: function (e) { setPrior(it.id, e.target.value); },
            oninput: function (e) { e.target.setAttribute('data-locked', e.target.value === '' ? 'false' : 'true'); }
          })));
      });
    }

    root.appendChild(h('section', { class: 'section' },
      h('div', { class: 'section-title', text: '參考單價' }),
      h('div', { class: 'section-note', text:
        '有些物品在每一包裡都綁在一起賣，數學上分不出誰值多少。填個大概的數字，' +
        '引擎在這種分不出來的情況下就會往你的猜測靠。' }),
      h('div', { class: 'section-note', style: 'color:var(--accent-ink)', text:
        '這不是鎖定 —— 它只相當於「一筆禮包」的份量。資料一旦足以自己定住某個物品，' +
        '那一項的參考值就會自動退場，之後完全由資料決定。填錯了也會被資料修正。' }),
      h('div', { class: 'section-note', style: 'color:var(--ref-ink)', text:
        '每一列後面那個「行情參考」是另一回事：那是寫在物品目錄裡的市場行情，' +
        '完全不參與計算，只在看板與試算頁多開一欄給你對照。想讓某個數字真的影響推算，' +
        '才要把它填進右邊這一格。' }),
      lockList));

    var s = state.settings;

    // 算法
    var seg = h('div', { class: 'seg' });
    WR_SOLVER.METHODS.forEach(function (mm) {
      seg.appendChild(h('button', {
        class: s.method === mm.id ? 'on' : '',
        onclick: function () { s.method = mm.id; state.compare = null; recompute(); render(); persistSettings(); }
      }, mm.label));
    });
    var chosen = WR_SOLVER.methodInfo(s.method);

    root.appendChild(h('section', { class: 'section' },
      h('div', { class: 'section-title', text: '看板用哪種算法' }),
      h('div', { class: 'section-note', text:
        '三種都在算同一件事，差別在「怎麼看待跟其他禮包格格不入的那幾筆」。' +
        '不確定就留在穩健回歸 —— 試算頁可以隨時把四種算法並排比較。' }),
      h('div', { class: 'card card-pad', style: 'display:flex; flex-direction:column; gap:11px' },
        seg,
        h('div', { class: 'section-note', style: 'margin:0', text: chosen.blurb }))));

    // 推算參數
    root.appendChild(h('section', { class: 'section' },
      h('div', { class: 'section-title', text: '推算參數' }),
      h('div', { class: 'section-note', text: '這幾個平常不用動，預設值就是合理的。看板上的數字怪怪的時候再回來調。' }),
      h('div', { class: 'card' },
        settingRow('忽略比較貴的同款單品包',
          '同一個物品如果有好幾個「只含它」的禮包，只有最便宜的那個算數。' +
          '例如「白金 1000 賣 100 元」和「白金 1500 賣 130 元」同時在架上，前者就不算行情 —— ' +
          '沒有人會買它。開著的時候，基準單價代表「你買得到的最好價格」；關掉的話代表「平均行情」。' +
          '注意只有純單品適用，組合包永遠不會被這條規則排除。',
          h('label', { class: 'switch' },
            h('input', { type: 'checkbox', checked: s.dropDominatedSingles !== false ? true : null,
              onchange: function (e) {
                s.dropDominatedSingles = e.target.checked;
                state.compare = null; recompute(); render(); persistSettings();
              } }),
            h('span'))),
        settingRow('參考單價的份量',
          '你填的參考單價相當於「幾筆禮包」的份量。1 代表某物品出現在 1 包裡時，' +
          '答案大約一半來自你的猜測；出現在 10 包裡時就只剩 9%。調高會讓猜測更有份量，' +
          '但資料夠多時反而會把答案拉偏。沒填參考單價的話這個值不影響任何事。',
          h('input', { type: 'range', min: '0', max: '8', step: '0.5', value: s.priorWeight,
            oninput: function (e) {
              s.priorWeight = Number(e.target.value);
              e.target.parentNode.querySelector('.setting-value').textContent = s.priorWeight.toFixed(1);
              recomputeSoon(); persistSettings();
            } }),
          h('span', { class: 'setting-value', text: Number(s.priorWeight).toFixed(1) })),
        settingRow('大小包一樣重要',
          '開著的話，30 元的小包和 3290 元的大包有一樣的發言權。關掉的話大包會主導整個結果，' +
          '你記的那些小包等於白記。建議保持開啟。',
          h('label', { class: 'switch' },
            h('input', { type: 'checkbox', checked: s.relativeWeighting ? true : null,
              onchange: function (e) { s.relativeWeighting = e.target.checked; recompute(); render(); persistSettings(); } }),
            h('span'))),
        settingRow('重算次數',
          '為了算出「可能區間」，程式會把你的禮包隨機抽換再重算很多次。次數越多區間越穩定，但會慢一點。',
          h('input', { type: 'number', min: '30', max: '600', step: '10', value: s.samples,
            onchange: function (e) { s.samples = Number(e.target.value) || 240; recompute(); render(); persistSettings(); } })),
        settingRow('區間要畫多寬',
          '看板上那條淺色橫條的寬度。0.8 代表「有八成機會真實單價落在這條裡」。' +
          '只影響橫條，不影響單價本身。',
          h('input', { type: 'number', min: '0.5', max: '0.99', step: '0.05', value: s.interval,
            onchange: function (e) { s.interval = Number(e.target.value) || 0.8; recompute(); render(); persistSettings(); } }))
      )));

    if (!firstRun) append(root, dataSection());
  }

  /** 資料存在哪裡，以及跟試算表之間的各種動作。 */
  function dataSection() {
    var connected = WRBridge.mode() === 'sheet';
    var card = h('div', { class: 'card card-pad', style: 'display:flex; flex-direction:column; gap:11px' });

    card.appendChild(h('div', { style: 'display:flex; align-items:center; gap:9px; flex-wrap:wrap' },
      h('span', { class: 'pill ' + (connected ? 'conf-high' : 'conf-none') },
        h('span', { class: 'dot' }), connected ? '已連接試算表' : '本機模式'),
      h('span', { class: 'section-note', text: connected
        ? (state.spreadsheetName || '資料存在你的 Google 試算表，手機電腦都同步。')
        : '資料存在這台裝置的瀏覽器裡，換一台裝置就看不到。' })));

    if (connected) {
      card.appendChild(h('button', { class: 'btn btn-primary btn-block', onclick: function () {
        busy(true);
        reload().then(function () { toast('已從試算表重新讀取'); }).then(function () { busy(false); });
      } }, h('span', { svg: ICON.sync }), '從試算表重新讀取'));
      card.appendChild(h('div', { class: 'section-note',
        text: '在別台裝置上新增或修改之後，按這個就會把最新的資料抓下來。' }));

      // 手機上手打那串 Apps Script 網址幾乎不可能，所以做成一條連結。
      card.appendChild(h('button', { class: 'btn btn-block', onclick: copyHandoff },
        h('span', { svg: ICON.check }), '複製「在手機上開啟」的連結'));
      card.appendChild(h('div', { class: 'section-note',
        text: '這條連結裡含有你的密碼，開啟之後就會自動連上同一份試算表。只傳給自己（例如自己的 LINE 記事本），不要外流。' }));

      card.appendChild(h('button', { class: 'btn btn-block', onclick: syncBoard },
        h('span', { svg: ICON.sync }), '把單價看板寫回試算表'));
      if (state.spreadsheetUrl) {
        card.appendChild(h('a', { class: 'btn btn-block', href: state.spreadsheetUrl, target: '_blank', rel: 'noopener' },
          '開啟試算表'));
      }
      var stray = WRBridge.localBundles();
      if (stray.length) {
        card.appendChild(h('button', { class: 'btn btn-block', onclick: function () { uploadLocal(stray); } },
          '把這台裝置上的 ' + stray.length + ' 筆舊資料上傳'));
      }
      card.appendChild(h('button', { class: 'btn btn-block btn-ghost', onclick: function () {
        if (!window.confirm('中斷連線後會切回本機模式。試算表上的資料不會被刪除。')) return;
        WRBridge.disconnect();
        reload();
      } }, '中斷連線'));
    } else {
      card.appendChild(h('button', { class: 'btn btn-primary btn-block', onclick: openConnect },
        h('span', { svg: ICON.sync }), '連接 Google 試算表'));
      card.appendChild(h('div', { class: 'section-note',
        text: '連上之後資料會改存在試算表，手機和電腦就會同步，也能直接在試算表上編輯。設定方式見專案的 README。' }));
    }

    // 完全重複的紀錄：引擎本來就會自動合併，但清掉之後清單才不會一直看到兩份。
    var dups = WR_SOLVER.duplicateGroups(state.bundles);
    var extra = dups.reduce(function (s, g) { return s + g.drop.length; }, 0);
    if (extra) {
      card.appendChild(h('button', { class: 'btn btn-block', onclick: function () { mergeDuplicates(dups, extra); } },
        h('span', { svg: ICON.trash }), '合併 ' + dups.length + ' 組重複（刪掉多餘的 ' + extra + ' 筆）'));
      card.appendChild(h('div', { class: 'section-note',
        text: '有 ' + extra + ' 筆跟另一筆完全相同（售價與內容物都一樣）。推算時本來就已經自動合併，' +
          '按這個只是把多餘的紀錄也刪掉，清單比較乾淨。每組會保留最早的那一筆。' }));
    }

    card.appendChild(h('button', { class: 'btn btn-block btn-ghost', onclick: loadSample }, '載入範例禮包'));

    var io = h('div', { class: 'card card-pad', style: 'display:flex; flex-direction:column; gap:9px' },
      h('div', { class: 'section-note',
        text: '① 複製提示詞 → ② 連同商城截圖丟給任何看得懂圖的 AI → ③ 把它回你的 JSON 貼回來。' }),
      h('button', { class: 'btn btn-block', onclick: copyPrompt },
        h('span', { svg: ICON.check }), '複製辨識提示詞'),
      h('button', { class: 'btn btn-primary btn-block', onclick: function () { openImport(''); } },
        h('span', { svg: ICON.plus }), '貼上 JSON 批次新增'),
      h('button', { class: 'btn btn-block btn-ghost', onclick: exportJson }, '匯出成 JSON'));

    return [
      h('section', { class: 'section' },
        h('div', { class: 'section-title', text: '資料存放' }), card),
      h('section', { class: 'section' },
        h('div', { class: 'section-title', text: '批次匯入 / 匯出' }), io)
    ];
  }

  /* ====================================================================
     JSON 批次匯入
     ==================================================================== */

  var importReady = null;

  function openImport(initialText) {
    importReady = null;
    var body = $('importBody');
    clear(body);

    body.appendChild(h('div', { class: 'notice' },
      h('span', { class: 'ico', svg: ICON.alert }),
      h('span', { text: '流程：截圖商城 → 複製下面的提示詞連同截圖丟給 AI → 把它回你的 JSON 整段貼到下面 → 檢查 → 匯入。' })));

    body.appendChild(h('button', { class: 'btn btn-block', onclick: copyPrompt },
      h('span', { svg: ICON.check }), '複製辨識提示詞'));

    body.appendChild(h('div', { class: 'field' },
      h('label', { class: 'field-label', text: 'JSON', for: 'importText' }),
      h('textarea', {
        class: 'field-input', id: 'importText', rows: '9', spellcheck: 'false',
        style: 'font-family:var(--font-num); font-size:12.5px; resize:vertical; min-height:150px',
        placeholder: '{\n  "bundles": [\n    { "name": "微晶片小包", "price": 130, "items": { "微晶片": 12800 } }\n  ]\n}',
        oninput: function () { importReady = null; paintImportResult(null); }
      }, initialText || '')));

    body.appendChild(h('div', { id: 'importResult' }));

    paintImportFoot();
    openSheet('importSheet');
  }

  function paintImportFoot() {
    var foot = $('importFoot');
    clear(foot);
    if (importReady) {
      foot.appendChild(h('button', { class: 'btn', onclick: function () { importReady = null; paintImportFoot(); paintImportResult(null); } }, '重新檢查'));
      foot.appendChild(h('button', { class: 'btn btn-primary', onclick: runImport },
        h('span', { svg: ICON.check }), '匯入 ' + importReady.length + ' 筆'));
    } else {
      foot.appendChild(h('button', { class: 'btn btn-primary btn-block', onclick: checkImport }, '檢查'));
    }
  }

  function checkImport() {
    var res = WR_IMPORT.parse($('importText').value);
    paintImportResult(res);
    importReady = res.ok ? res.bundles : null;
    paintImportFoot();
  }

  function paintImportResult(res) {
    var box = $('importResult');
    if (!box) return;
    clear(box);
    if (!res) return;

    var errors = res.issues.filter(function (i) { return i.level === 'error'; });
    var warns = res.issues.filter(function (i) { return i.level === 'warn'; });

    if (errors.length) {
      box.appendChild(h('div', { class: 'notice notice-warn', style: 'margin-bottom:9px' },
        h('span', { class: 'ico', svg: ICON.alert }),
        h('span', { text: '有 ' + errors.length + ' 個問題，修好之後再檢查一次。有問題的那幾筆都不會被匯入。' })));
      errors.slice(0, 12).forEach(function (e) {
        box.appendChild(h('div', { class: 'section-note', style: 'color:var(--critical-ink); padding:3px 0', text: '• ' + e.text }));
      });
      if (res.unknownItems.length) {
        box.appendChild(h('div', { class: 'section-note', style: 'margin-top:9px',
          text: '認不得的名稱：' + res.unknownItems.join('、') + '。請改成提示詞清單裡的中文名，或把它移到 unknown 欄位。' }));
      }
      return;
    }

    warns.forEach(function (w) {
      box.appendChild(h('div', { class: 'notice notice-warn', style: 'margin-bottom:9px' },
        h('span', { class: 'ico', svg: ICON.alert }), h('span', { text: w.text })));
    });

    box.appendChild(h('div', { class: 'section-title', style: 'margin:11px 0 7px', text: '預覽 ' + res.bundles.length + ' 筆' }));
    var list = h('div', { class: 'card' });
    res.bundles.forEach(function (b) {
      list.appendChild(h('div', { class: 'slot', style: 'grid-template-columns: minmax(0,1fr) auto' },
        h('div', { style: 'min-width:0' },
          h('div', { class: 'slot-name', text: (b.name || '（未命名）') + (b.enabled === false ? '（不納入推算）' : '') }),
          h('div', { class: 'slot-sub', text: Object.keys(b.qty).map(function (id) {
            return WR_CATALOG.labelOf(id) + ' ' + fmtQty(b.qty[id]);
          }).join('、') })),
        h('div', { class: 'num', style: 'font-size:15px; font-weight:600', text: 'NT$' + group(b.price) })));
    });
    box.appendChild(list);
  }

  function runImport() {
    if (!importReady || !importReady.length) return;
    var n = importReady.length;
    closeSheet('importSheet');
    busy(true);
    WRBridge.call('saveBundles', importReady).then(function (res) {
      state.bundles = res.bundles;
      importReady = null;
      recompute();
      render();
      toast('已匯入 ' + n + ' 筆');
    }).catch(failed).then(function () { busy(false); });
  }

  function exportJson() {
    if (!state.bundles.length) { toast('目前沒有資料可以匯出'); return; }
    openImport(WR_IMPORT.serialize(state.bundles));
    toast('已填入 ' + state.bundles.length + ' 筆，可以全選複製起來備份');
  }

  function copyPrompt() {
    copyText(WR_PROMPT.TEXT, '已複製辨識提示詞');
  }

  /** navigator.clipboard 在非 https 或權限被擋時會失敗，退回舊的 execCommand。 */
  function copyText(text, okMessage) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed; opacity:0; pointer-events:none';
      document.body.appendChild(ta);
      ta.select();
      var done = false;
      try { done = document.execCommand('copy'); } catch (e) { done = false; }
      document.body.removeChild(ta);
      toast(done ? okMessage : '複製失敗，請手動選取文字');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(okMessage); }, fallback);
    } else {
      fallback();
    }
  }

  /* ====================================================================
     連接試算表
     ==================================================================== */

  function openConnect() {
    var conn = WRBridge.connection() || { url: '', token: '' };
    var body = $('connectBody');
    clear(body);

    body.appendChild(h('div', { class: 'notice' },
      h('span', { class: 'ico', svg: ICON.alert }),
      h('span', { text: '還沒設定過的話，請先照 README 把 Code.gs 貼進 Apps Script、填好密碼與試算表 ID，然後部署成網頁應用程式（「誰可以存取」要選「所有人」）。' })));

    body.appendChild(h('div', { class: 'field' },
      h('label', { class: 'field-label', text: 'Apps Script 網址', for: 'connUrl' }),
      h('input', { class: 'field-input', id: 'connUrl', type: 'url', inputmode: 'url',
        placeholder: 'https://script.google.com/macros/s/.../exec', value: conn.url })));

    body.appendChild(h('div', { class: 'field' },
      h('label', { class: 'field-label', text: '密碼', for: 'connToken' }),
      h('input', { class: 'field-input', id: 'connToken', type: 'password',
        placeholder: '你在 Code.gs 裡設定的那一組', value: conn.token })));

    body.appendChild(h('div', { class: 'section-note', id: 'connStatus',
      text: '密碼只會存在這台裝置的瀏覽器裡，不會上傳到任何地方。' }));

    var foot = $('connectFoot');
    clear(foot);
