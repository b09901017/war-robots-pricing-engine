<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="War Robots 商城禮包比價：從歷史禮包反解各物品的基準單價，再判斷新禮包值不值得買。">
  <meta name="theme-color" content="#0b0e13" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
  <title>War Robots 禮包比價</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><text y='16' font-size='16'>📊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+TC:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <!--include:styles-->
</head>
<body>

<div class="app">
  <!-- 電腦版側欄 -->
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark">War Robots</div>
      <div class="brand-name">禮包比價</div>
    </div>
    <nav class="rail-nav" id="railNav" aria-label="主要導覽"></nav>
    <div style="margin-top:auto; display:flex; flex-direction:column; gap:8px;">
      <div id="railConn"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="viewTitle">單價看板</h1>
        <div class="topbar-sub" id="viewSub">讀取中…</div>
      </div>
      <div class="topbar-actions" id="topActions"></div>
    </header>

    <main class="view" id="viewBoard"></main>
    <main class="view" id="viewBundles" hidden></main>
    <main class="view" id="viewEvaluate" hidden></main>
    <main class="view" id="viewSettings" hidden></main>
  </div>
</div>

<!-- 手機版底部分頁 -->
<nav class="tabbar" id="tabBar" aria-label="主要導覽"></nav>

<button class="fab" id="fab" hidden></button>

<div class="scrim" id="scrim"></div>

<!-- 連接試算表 -->
<section class="sheet" id="connectSheet" role="dialog" aria-modal="true" aria-labelledby="connectTitle" aria-hidden="true">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <div>
      <div class="sheet-title" id="connectTitle">連接試算表</div>
      <div class="sheet-sub">貼上 Apps Script 的網址和你設定的密碼</div>
    </div>
    <button class="btn btn-sm btn-ghost" id="connectClose">關閉</button>
  </div>
  <div class="sheet-body" id="connectBody"></div>
  <div class="sheet-foot" id="connectFoot"></div>
</section>

<!-- JSON 匯入 / 匯出 -->
<section class="sheet" id="importSheet" role="dialog" aria-modal="true" aria-labelledby="importTitle" aria-hidden="true">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <div>
      <div class="sheet-title" id="importTitle">從截圖批次新增</div>
      <div class="sheet-sub">截圖丟給 AI 辨識，把它產出的 JSON 貼進來</div>
    </div>
    <button class="btn btn-sm btn-ghost" id="importClose">關閉</button>
  </div>
  <div class="sheet-body" id="importBody"></div>
  <div class="sheet-foot" id="importFoot"></div>
</section>

<!-- 禮包編輯器：整頁，不是彈窗。內容在上、數字鍵盤常駐在下。 -->
<section class="editor" id="editor" role="dialog" aria-modal="true" aria-labelledby="editorTitle" hidden>
  <header class="editor-bar">
    <button class="editor-back" id="editorBack" aria-label="返回"></button>
    <h2 id="editorTitle">新增禮包</h2>
    <button class="btn btn-sm btn-primary" id="editorSave">儲存</button>
  </header>
  <div class="editor-body" id="editorBody"></div>
  <div class="pad" id="editorPad"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!--include:lib:catalog-->
<!--include:lib:linalg-->
<!--include:lib:solver-->
<!--include:lib:evaluate-->
<!--include:lib:sample-->
<!--include:lib:importer-->
<!--include:lib:prompt-->
<!--include:bridge-->
<!--include:app-->

</body>
</html>
