<style>
/* ==========================================================================
   設計系統
   儀表板取向：外框一律是冷調石墨單色，飽和色只留給「有意義」的東西
   —— 評價等級、信心度、貢獻占比。層級靠字級、留白與細線撐起來，
   不靠處處圓角與陰影。
   ========================================================================== */

:root {
  color-scheme: light;

  --plane:        #f2f4f7;
  --surface:      #ffffff;
  --surface-2:    #f7f8fa;
  --surface-3:    #eaeef3;
  --line:         rgba(14, 19, 27, 0.10);
  --line-strong:  rgba(14, 19, 27, 0.20);

  --ink:          #111720;
  --ink-2:        #525d70;
  --ink-3:        #8290a5;

  --accent:       #2f6fb5;
  --accent-ink:   #235a97;
  --accent-soft:  rgba(47, 111, 181, 0.10);

  --good:         #0ca30c;
  --good-ink:     #006300;
  --warning:      #fab219;
  --warning-ink:  #8a5d00;
  --serious:      #ec835a;
  --serious-ink:  #9c4620;
  --critical:     #d03b3b;
  --critical-ink: #a72b2b;

  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --s4: #eda100; --s5: #e87ba4; --s6: #8792a4;

  /* 行情參考價專用色：跟 accent（求解結果）和 tier（評價）都不同色系，
     免得那條虛線被讀成「另一個算出來的區間」或「一個評價」。 */
  --ref:     #7a5bd6;
  --ref-ink: #5c3fb0;

  --shadow-sheet: 0 -8px 40px rgba(14, 19, 27, 0.14);
  --shadow-card:  0 1px 2px rgba(14, 19, 27, 0.05);

  --font-ui: 'Manrope', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-num: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --rail: 264px;
  --gutter: 20px;
  --radius: 14px;
  --radius-sm: 9px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;

    --plane:        #0b0e13;
    --surface:      #141921;
    --surface-2:    #1a202a;
    --surface-3:    #232b37;
    --line:         rgba(226, 236, 255, 0.09);
    --line-strong:  rgba(226, 236, 255, 0.18);

    --ink:          #e9eef6;
    --ink-2:        #99a5b9;
    --ink-3:        #68748a;

    --accent:       #4d8fd6;
    --accent-ink:   #7fb1e8;
    --accent-soft:  rgba(77, 143, 214, 0.16);

    --good:         #0ca30c;
    --good-ink:     #3dc63d;
    --warning:      #fab219;
    --warning-ink:  #fab219;
    --serious:      #ec835a;
    --serious-ink:  #ec835a;
    --critical:     #d03b3b;
    --critical-ink: #e66767;

    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --s4: #c98500; --s5: #d55181; --s6: #5a6472;

    --ref:     #9b82ea;
    --ref-ink: #ad97f0;

    --shadow-sheet: 0 -8px 44px rgba(0, 0, 0, 0.55);
    --shadow-card:  none;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:        #0b0e13;
  --surface:      #141921;
  --surface-2:    #1a202a;
  --surface-3:    #232b37;
  --line:         rgba(226, 236, 255, 0.09);
  --line-strong:  rgba(226, 236, 255, 0.18);
  --ink:          #e9eef6;
  --ink-2:        #99a5b9;
  --ink-3:        #68748a;
  --accent:       #4d8fd6;
  --accent-ink:   #7fb1e8;
  --accent-soft:  rgba(77, 143, 214, 0.16);
  --good:         #0ca30c;
  --good-ink:     #3dc63d;
  --warning:      #fab219;
  --warning-ink:  #fab219;
  --serious:      #ec835a;
  --serious-ink:  #ec835a;
  --critical:     #d03b3b;
  --critical-ink: #e66767;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --s4: #c98500; --s5: #d55181; --s6: #5a6472;
  --ref:     #9b82ea;
  --ref-ink: #ad97f0;
  --shadow-sheet: 0 -8px 44px rgba(0, 0, 0, 0.55);
  --shadow-card:  none;
}

* { box-sizing: border-box; }

/* 元件自己的 display 規則會蓋掉瀏覽器預設的 [hidden]，所以這條必須存在，
   否則 .fab 這種設了 display 的元素加上 hidden 屬性仍然看得見。 */
[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--plane);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 版面骨架 ---------------------------------------------------- */

.app { display: flex; min-height: 100%; }

.rail {
  display: none;
  width: var(--rail);
  flex: 0 0 var(--rail);
  flex-direction: column;
  gap: 28px;
  padding: 28px 18px calc(20px + env(safe-area-inset-bottom, 0px));
  border-right: 1px solid var(--line);
  background: var(--surface);
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.brand-mark {
  font-size: 10px; font-weight: 700; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--ink-3);
}
.brand-name { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }

.rail-nav { display: flex; flex-direction: column; gap: 2px; }
.rail-nav button {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  font-size: 14.5px; font-weight: 600; color: var(--ink-2);
  text-align: left; width: 100%;
}
.rail-nav button:hover { background: var(--surface-2); color: var(--ink); }
.rail-nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }
.rail-nav .ico { width: 18px; flex: 0 0 18px; display: grid; place-items: center; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 13px var(--gutter);
  background: color-mix(in srgb, var(--plane) 88%, transparent);
  backdrop-filter: blur(14px) saturate(160%);
  border-bottom: 1px solid var(--line);
}
.topbar h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
.topbar-sub { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }

.view {
  flex: 1;
  padding: 22px var(--gutter) calc(112px + env(safe-area-inset-bottom, 0px));
  max-width: 1160px; width: 100%; margin: 0 auto;
  display: flex; flex-direction: column; gap: 26px;
}
.view[hidden] { display: none; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(16px) saturate(160%);
  border-top: 1px solid var(--line);
}
.tabbar button {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 7px 4px; border-radius: 10px;
  font-size: 11px; font-weight: 700; color: var(--ink-3);
}
.tabbar button[aria-current="page"] { color: var(--accent-ink); background: var(--accent-soft); }

@media (min-width: 900px) {
  .rail { display: flex; }
  .tabbar { display: none; }
  .view { padding-bottom: 60px; padding-inline: 32px; }
  .topbar { padding-inline: 32px; }
  :root { --gutter: 32px; }
}

/* ---------- 通用元件 ---------------------------------------------------- */

.section { display: flex; flex-direction: column; gap: 13px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-title { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.section-note { font-size: 12.5px; color: var(--ink-3); }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
}
.card-pad { padding: 16px 18px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 15px; border-radius: 10px;
  border: 1px solid var(--line-strong);
  font-size: 14px; font-weight: 700; color: var(--ink);
  background: var(--surface);
  transition: background .13s ease, border-color .13s ease;
}
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-ink); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-danger { color: var(--critical-ink); border-color: var(--line-strong); }
.btn-danger:hover { background: color-mix(in srgb, var(--critical) 12%, transparent); }
.btn-sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 700; line-height: 1.5;
  border: 1px solid var(--line);
  color: var(--ink-2); background: var(--surface-2);
  white-space: nowrap;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 6px; }

/* 信心度：顏色之外一定有文字，不讓顏色單獨承載意義 */
.conf-high   { color: var(--good-ink); }
.conf-high   .dot { background: var(--good); }
.conf-mid    { color: var(--ink-2); }
.conf-mid    .dot { background: var(--ink-3); }
.conf-low    { color: var(--serious-ink); }
.conf-low    .dot { background: var(--serious); }
.conf-none   { color: var(--ink-3); }
.conf-none   .dot { background: var(--line-strong); }
.conf-locked { color: var(--accent-ink); }
.conf-locked .dot { background: var(--accent); }
/* 行情參考：跟信心度不同性質，所以不借用 conf-* 的顏色，自己一組。 */
.pill-ref {
  color: var(--ref-ink);
  border-color: color-mix(in srgb, var(--ref) 45%, var(--line));
  background: color-mix(in srgb, var(--ref) 8%, transparent);
}

.empty {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 44px 24px; text-align: center;
  color: var(--ink-3); font-size: 14px;
}
.empty strong { color: var(--ink-2); font-size: 15px; font-weight: 700; }

.notice {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 11px 14px; border-radius: var(--radius-sm);
  font-size: 13px; line-height: 1.5;
  border: 1px solid var(--line);
  background: var(--surface-2); color: var(--ink-2);
}
.notice .ico { flex: 0 0 16px; margin-top: 1px; }
.notice-warn { border-color: color-mix(in srgb, var(--warning) 45%, var(--line)); }
.notice-warn .ico { color: var(--warning-ink); }

/* ---------- 統計磚 ------------------------------------------------------ */

.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat {
  display: flex; flex-direction: column; gap: 3px;
  padding: 14px 15px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius);
}
.stat-label { font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
.stat-value { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; }
.stat-value small { font-size: 13px; font-weight: 600; color: var(--ink-3); margin-left: 2px; letter-spacing: 0; }
.stat-foot { font-size: 11.5px; color: var(--ink-3); }

@media (max-width: 520px) {
  .stat-value { font-size: 22px; }
  .stat { padding: 12px 13px; }
}

/* ---------- 單價看板 ---------------------------------------------------- */

.board { display: flex; flex-direction: column; }
.board-group-label {
  padding: 16px 2px 7px;
  font-size: 11.5px; font-weight: 700; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--ink-3);
}
.board-group-label:first-child { padding-top: 2px; }

.price-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 14px;
  padding: 13px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 8px;
  width: 100%; text-align: left;
  transition: border-color .13s ease;
}
.price-row:hover { border-color: var(--line-strong); }
.price-row-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.price-row-name { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.price-row-value { text-align: right; font-size: 17px; font-weight: 600; white-space: nowrap; }
/* 可收合的資料說明：外觀跟一般提示一致，但整塊可以點。 */
.notice-toggle {
  width: 100%; text-align: left; cursor: pointer;
  font: inherit; color: var(--ink-2);
}
.notice-toggle:hover { border-color: var(--line-strong); }

.price-row-value .unit { font-size: 11px; color: var(--ink-3); font-weight: 600; margin-left: 3px; font-family: var(--font-ui); }
/* 另一種基準口徑的對照值：看得到但不搶戲。 */
.price-alt {
  display: block; margin-top: 2px;
  font-size: 11px; font-weight: 600; color: var(--ink-3); font-family: var(--font-ui);
}
.price-row-meta {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 11.5px; color: var(--ink-3);
}

/* 區間條：以該物品自己的點估計為中心，從 0 畫到 2×，超出的部分用箭頭表示。 */
.range {
  grid-column: 1 / -1;
  position: relative; height: 14px; margin-top: 3px;
}
.range-track {
  position: absolute; left: 0; right: 0; top: 6px; height: 2px;
  background: var(--surface-3); border-radius: 1px;
}
.range-band {
  position: absolute; top: 3px; height: 8px;
  background: color-mix(in srgb, var(--accent) 26%, transparent);
  border-radius: 4px;
}
.range-point {
  position: absolute; top: 0; width: 3px; height: 14px;
  background: var(--accent); border-radius: 1.5px;
  box-shadow: 0 0 0 2px var(--surface);
}
.range-overflow {
  position: absolute; right: 0; top: 0;
  padding-left: 5px; background: var(--surface);
  font-size: 10px; color: var(--ink-3); line-height: 14px;
  font-family: var(--font-num);
}

/* 行情參考價在同一條軸上的位置。刻意用虛線外框而不是實心色塊：
   它不是求解出來的東西，不該看起來跟藍色的區間帶是同一種證據。 */
.range-ref {
  position: absolute; top: 0; height: 14px;
  border: 1px dashed var(--ref); border-radius: 3px;
  background: color-mix(in srgb, var(--ref) 10%, transparent);
  pointer-events: none;
}
.range-ref[data-point="true"] {
  border: 0; border-left: 2px solid var(--ref); border-radius: 0;
  background: none;
}
/* 行情參考價的文字對照，跟另一種基準口徑用同一種「不搶戲」的寫法。 */
.price-ref { color: var(--ref-ink); }
.price-ref b { font-family: var(--font-num); font-weight: 700; }

.share-bar { height: 3px; border-radius: 2px; background: var(--surface-3); overflow: hidden; width: 58px; flex: 0 0 58px; }
.share-bar i { display: block; height: 100%; background: var(--ink-3); border-radius: 2px; }

/* ---------- 禮包清單 ---------------------------------------------------- */

.bundle {
  display: flex; flex-direction: column; gap: 9px;
  padding: 15px 16px; margin-bottom: 9px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius);
  width: 100%; text-align: left;
  transition: border-color .13s ease;
}
.bundle:hover { border-color: var(--line-strong); }
.bundle-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.bundle-name { font-size: 15.5px; font-weight: 700; letter-spacing: -0.01em; }
.bundle-date { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
.bundle-price { font-size: 18px; font-weight: 600; white-space: nowrap; }
.bundle-price .cur { font-size: 11px; color: var(--ink-3); font-weight: 600; font-family: var(--font-ui); margin-right: 2px; }
.bundle-items { display: flex; flex-wrap: wrap; gap: 5px; }
.bundle-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-3); }
.bundle[data-disabled="true"] { opacity: .5; }

.tag {
  display: inline-flex; align-items: baseline; gap: 4px;
  padding: 3px 8px; border-radius: 7px;
  background: var(--surface-2); border: 1px solid var(--line);
  font-size: 12px; color: var(--ink-2); white-space: nowrap;
}
.tag b { font-weight: 700; color: var(--ink); font-family: var(--font-num); font-size: 11.5px; }

.fab {
  position: fixed; right: var(--gutter);
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  z-index: 25;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 13px 19px; border-radius: 999px;
  background: var(--accent); color: #fff;
  font-size: 14.5px; font-weight: 700;
  box-shadow: 0 6px 24px rgba(47, 111, 181, 0.4);
}
@media (min-width: 900px) { .fab { bottom: 32px; right: 32px; } }

/* ---------- 物品選取（丸子） -------------------------------------------- */

.picker-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
.picker-group-head { display: flex; align-items: baseline; gap: 8px; }
.picker-group-name { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.picker-group-hint { font-size: 11.5px; color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  font-size: 14px; font-weight: 600; color: var(--ink-2);
  transition: all .13s ease;
  min-height: 38px;
}
.chip:hover { border-color: var(--accent); color: var(--ink); }
.chip[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent); color: #fff;
}
.chip[aria-pressed="true"] .chip-qty { color: rgba(255,255,255,.82); }
.chip-qty { font-family: var(--font-num); font-size: 12px; font-weight: 600; color: var(--ink-3); }

/* ---------- 已選物品列 -------------------------------------------------- */

.slot {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  align-items: center; gap: 10px;
  padding: 11px 12px 11px 14px;
  border-bottom: 1px solid var(--line);
}
.slot:last-child { border-bottom: none; }
.slot-name { font-size: 14.5px; font-weight: 600; min-width: 0; }
.slot-sub { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }
.slot-qty {
  font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-size: 16px; font-weight: 600;
  padding: 7px 13px; border-radius: 9px;
  border: 1px solid var(--line-strong); background: var(--surface-2);
  min-width: 96px; text-align: right;
}
.slot-qty:hover { border-color: var(--accent); }
.slot-remove { width: 32px; height: 32px; border-radius: 8px; color: var(--ink-3); display: grid; place-items: center; }
.slot-remove:hover { background: var(--surface-3); color: var(--critical-ink); }

/* 大型數值輸入（售價／名稱） */
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.field-input {
  width: 100%; padding: 11px 13px;
  background: var(--surface-2); border: 1px solid var(--line-strong);
  border-radius: 10px; font-size: 15px;
}
.field-input:focus { border-color: var(--accent); outline: none; }
.field-big {
  display: flex; align-items: baseline; gap: 7px;
  width: 100%; padding: 13px 15px;
  background: var(--surface-2); border: 1px solid var(--line-strong);
  border-radius: 11px; text-align: left;
}
.field-big:hover { border-color: var(--accent); }
.field-big .cur { font-size: 13px; font-weight: 700; color: var(--ink-3); }
.field-big .val { font-family: var(--font-num); font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
.field-big .hint { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }

/* ---------- 試算結果：英雄讀數 ------------------------------------------ */

.verdict {
  display: flex; flex-direction: column; gap: 14px;
  padding: 22px 20px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--surface);
}
.verdict-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.verdict-figure { display: flex; flex-direction: column; gap: 2px; }
.verdict-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); }
.verdict-value { font-size: 54px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; }
.verdict-range { font-size: 12.5px; color: var(--ink-3); font-family: var(--font-num); }

.badge {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 15px; border-radius: 999px;
  font-size: 15px; font-weight: 800; letter-spacing: -0.01em;
  border: 1.5px solid currentColor;
}
.badge .ico { flex: 0 0 16px; }
.tone-good     { color: var(--good-ink); }
.tone-neutral  { color: var(--ink-2); }
.tone-warning  { color: var(--warning-ink); }
.tone-critical { color: var(--critical-ink); }
.tone-good     .bg-fill { background: var(--good); }
.tone-neutral  .bg-fill { background: var(--ink-3); }
.tone-warning  .bg-fill { background: var(--warning); }
.tone-critical .bg-fill { background: var(--critical); }

.verdict-blurb { font-size: 13.5px; color: var(--ink-2); }

.badge-sm {
  padding: 4px 10px; font-size: 12px; font-weight: 700; border-width: 1.2px;
}

/* ---------- 分段選擇器（算法、排序） ----------------------------------- */

.seg {
  display: inline-flex; padding: 3px; gap: 2px;
  background: var(--surface-2); border-radius: 11px;
  border: 1px solid var(--line);
  flex-wrap: wrap;
}
.seg button {
  padding: 7px 14px; border-radius: 8px;
  font-size: 13.5px; font-weight: 700; color: var(--ink-3);
  transition: background .13s ease, color .13s ease;
  min-height: 34px;
}
.seg button:hover { color: var(--ink); }
.seg button.on {
  background: var(--surface); color: var(--ink);
  box-shadow: 0 1px 3px rgba(0,0,0,.12);
}

/* ---------- 四種算法並排：預估價錢 × 性價比矩陣 -------------------------
   一列一種算法，兩個數字欄固定寬、右對齊，所以同一欄的數字上下對得齊 ——
   「一眼看出四種說法差多少」靠的就是這件事，欄寬一浮動就全毀了。
   ---------------------------------------------------------------------- */

.mtx { display: flex; flex-direction: column; }

.mtx-head, .mtx-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 104px 96px;
  gap: 14px; align-items: center;
  padding: 13px 16px;
  border-bottom: 1px solid var(--line);
}
.mtx-head {
  padding: 9px 16px; background: var(--surface-2);
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.07em; color: var(--ink-3);
}
.mtx-head span:not(:first-child) { text-align: right; }
.mtx-row:last-child { border-bottom: 0; }

.mtx-name { font-size: 14.5px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.mtx-tip { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; line-height: 1.45; }

.mtx-money { text-align: right; white-space: nowrap; }
.mtx-money b { font-family: var(--font-num); font-size: 15.5px; font-weight: 700; letter-spacing: -0.02em; }
.mtx-money .cur { font-size: 10.5px; color: var(--ink-3); font-weight: 600; margin-right: 2px; font-family: var(--font-ui); }
.mtx-money small { display: block; font-size: 10.5px; color: var(--ink-3); font-family: var(--font-num); margin-top: 2px; }

.mtx-ratio { text-align: right; white-space: nowrap; }
.mtx-ratio b { display: block; font-family: var(--font-num); font-size: 22px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
.mtx-ratio small { display: block; font-size: 10.5px; color: var(--ink-3); font-family: var(--font-num); margin-top: 2px; }
.mtx-ratio .tier { display: block; font-size: 11px; font-weight: 700; margin-top: 2px; }

/* 行情參考那一列不是算法，用虛線斷開，底色也換掉 —— 它跟上面四列
   不是同一種證據，畫成同一種列只會讓人以為它也是算出來的。 */
.mtx-row-ref { background: var(--surface-2); border-top: 1px dashed var(--line-strong); }

@media (max-width: 560px) {
  .mtx-head, .mtx-row { grid-template-columns: minmax(0, 1fr) 88px 72px; gap: 8px; padding: 11px 12px; }
  .mtx-head { padding: 8px 12px; letter-spacing: 0.02em; }
  .mtx-name { font-size: 13.5px; }
  .mtx-money b { font-size: 13.5px; }
  .mtx-ratio b { font-size: 19px; }
}

/* 理論價值 vs 售價 對照 */
.compare { display: flex; flex-direction: column; gap: 9px; }
.compare-row { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; align-items: center; gap: 11px; }
.compare-key { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.compare-track { height: 12px; background: var(--surface-3); border-radius: 6px; overflow: hidden; }
.compare-track i { display: block; height: 100%; border-radius: 6px; }
.compare-val { font-family: var(--font-num); font-size: 13.5px; font-weight: 600; white-space: nowrap; }

/* 貢獻堆疊條 */
.stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px; background: var(--surface-3); }
.stack i { display: block; height: 100%; }
.stack i:first-child { border-radius: 7px 0 0 7px; }
.stack i:last-child { border-radius: 0 7px 7px 0; }

.legend { display: flex; flex-direction: column; gap: 0; }
.legend-row {
  display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto;
  align-items: center; gap: 10px;
  padding: 9px 2px; border-bottom: 1px solid var(--line);
  font-size: 13.5px;
}
.legend-row:last-child { border-bottom: none; }
.legend-swatch { width: 10px; height: 10px; border-radius: 3px; }
.legend-name { min-width: 0; font-weight: 600; }
.legend-name span { display: block; font-size: 11.5px; font-weight: 500; color: var(--ink-3); }
.legend-val { font-family: var(--font-num); font-size: 13px; font-weight: 600; white-space: nowrap; }
.legend-share { font-family: var(--font-num); font-size: 12px; color: var(--ink-3); width: 42px; text-align: right; }

/* ---------- 底部面板（編輯器 / 數字鍵盤） -------------------------------- */

.scrim {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(6, 9, 13, 0.55);
  backdrop-filter: blur(3px);
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease;
}
.scrim[data-open="true"] { opacity: 1; pointer-events: auto; }

.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
  display: flex; flex-direction: column;
  max-height: 92vh;
  background: var(--surface);
  border-top: 1px solid var(--line-strong);
  border-radius: 18px 18px 0 0;
  box-shadow: var(--shadow-sheet);
  transform: translateY(101%);
  /* 關閉時一併收掉 visibility，否則面板裡的按鈕仍然能被 Tab 聚焦到。 */
  visibility: hidden;
  transition: transform .26s cubic-bezier(.32, .72, 0, 1), visibility .26s;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet[data-open="true"] { transform: translateY(0); visibility: visible; }
@media (prefers-reduced-motion: reduce) {
  .sheet, .scrim { transition: none; }
}
@media (min-width: 760px) {
  .sheet {
    left: 50%; right: auto; bottom: 0;
    width: min(620px, 94vw);
    transform: translate(-50%, 101%);
    border-radius: 18px 18px 0 0;
  }
  .sheet[data-open="true"] { transform: translate(-50%, 0); }
}

.sheet-grip { width: 34px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 9px auto 0; flex: 0 0 auto; }
.sheet-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 13px 18px 11px; border-bottom: 1px solid var(--line); flex: 0 0 auto;
}
.sheet-title { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
.sheet-sub { font-size: 12px; color: var(--ink-3); }
.sheet-body { overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 17px; -webkit-overflow-scrolling: touch; }
.sheet-foot {
  display: flex; gap: 9px; padding: 12px 18px 16px;
  border-top: 1px solid var(--line); flex: 0 0 auto;
  background: var(--surface);
}
.sheet-foot .btn { flex: 1; padding-block: 12px; }


/* ---------- 編輯頁：單一畫面 + 常駐數字鍵盤 -----------------------------
   舊版把售價和每個數量都做成彈出面板，於是新增一筆禮包要開關四五次面板，
   而且剛加進去的物品會被捲出畫面。改成一頁到底：上面是你正在建的東西，
   下面是永遠不動的鍵盤，打字打到哪裡由上面的「焦點」決定。
   ---------------------------------------------------------------------- */

.editor {
  position: fixed; inset: 0; z-index: 35;
  display: flex; flex-direction: column;
  background: var(--plane);
}
.editor[hidden] { display: none !important; }

.editor-bar {
  flex: 0 0 auto;
  display: grid; grid-template-columns: 44px 1fr auto;
  align-items: center; gap: 10px;
  padding: 10px 14px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.editor-bar h2 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; text-align: center; }
.editor-back {
  width: 40px; height: 40px; border-radius: 11px;
  display: grid; place-items: center; color: var(--ink-2);
}
.editor-back:hover { background: var(--surface-2); color: var(--ink); }

.editor-body {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 16px var(--gutter) 22px;
  display: flex; flex-direction: column; gap: 18px;
  -webkit-overflow-scrolling: touch;
}
@media (min-width: 760px) {
  .editor-body { max-width: 640px; width: 100%; margin: 0 auto; }
  .editor-bar { max-width: 640px; width: 100%; margin: 0 auto; border-radius: 0; }
}

.ed-label {
  font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-3);
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
}
.ed-label em { font-style: normal; text-transform: none; letter-spacing: 0; font-size: 12.5px; font-weight: 600; }

/* 可被鍵盤輸入的欄位：有焦點時整格亮起來，一眼看出現在在打哪一個 */
.slot-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }

.ed-price {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; padding: 16px 18px;
  background: var(--surface); border: 2px solid var(--line);
  border-radius: var(--radius); text-align: left;
  transition: border-color .12s ease, background .12s ease;
}
.ed-price .cur { font-size: 13px; font-weight: 700; color: var(--ink-3); }
.ed-price .val {
  font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-size: 30px; font-weight: 600; letter-spacing: -0.03em;
}
.ed-price .val.is-empty { color: var(--ink-3); }
.ed-price[data-focus="true"] { border-color: var(--accent); background: var(--accent-soft); }

.ed-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto 36px;
  align-items: center; gap: 10px;
  padding: 12px 8px 12px 14px;
  border-bottom: 1px solid var(--line);
  border-left: 3px solid transparent;
  width: 100%; text-align: left;
  transition: background .12s ease, border-color .12s ease;
}
.ed-row:last-of-type { border-bottom: none; }
.ed-row[data-focus="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.ed-row-name { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.ed-row-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
.ed-row-qty {
  font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-size: 19px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap;
}
.ed-row[data-focus="true"] .ed-row-qty { color: var(--accent-ink); }
.ed-row-x {
  width: 32px; height: 32px; border-radius: 8px;
  display: grid; place-items: center; color: var(--ink-3);
}
.ed-row-x:hover { background: var(--surface-3); color: var(--critical-ink); }

/* 編輯器底部的四種算法縮圖：邊打邊看得到四個答案。
   這裡空間只有一張手機寬，所以每一格只留「算法名 / 指數 / 預估價錢」三行，
   區間與說明留給試算頁的完整矩陣。 */
.ed-verdicts { border-top: 1px solid var(--line); background: var(--surface-2); }
.ed-verdicts-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  padding: 10px 14px 9px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-3);
}
.ed-verdicts-head em { font-style: normal; letter-spacing: 0; font-weight: 600; }
.ed-vgrid { display: grid; gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.ed-v {
  background: var(--surface-2); padding: 9px 4px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center;
  min-width: 0;
}
.ed-v-name { font-size: 10.5px; font-weight: 700; color: var(--ink-3); white-space: nowrap; }
.ed-v-ratio { font-family: var(--font-num); font-size: 18px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; }
.ed-v-money { font-family: var(--font-num); font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
.ed-v[data-current="true"] { background: var(--surface); box-shadow: inset 0 2px 0 var(--accent); }
.ed-vref {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  padding: 9px 14px; border-top: 1px dashed var(--line-strong);
  font-size: 11.5px; color: var(--ink-3);
}
.ed-vref b { font-family: var(--font-num); font-size: 13px; font-weight: 700; color: var(--ink-2); }
.ed-vwait { padding: 12px 14px; font-size: 12px; color: var(--ink-3); text-align: center; }

.ed-empty {
  padding: 15px 18px; text-align: center;
  font-size: 13px; color: var(--ink-3);
}

.ed-more {
  align-self: flex-start;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px; border-radius: 999px;
  font-size: 12.5px; font-weight: 700; color: var(--ink-3);
  border: 1px dashed var(--line-strong);
}
.ed-more:hover { color: var(--ink); border-color: var(--accent); }

/* ---------- 常駐數字鍵盤 ----------------------------------------------- */

.pad {
  flex: 0 0 auto;
  border-top: 1px solid var(--line);
  background: var(--surface);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (min-width: 760px) {
  .pad-inner { max-width: 640px; margin: 0 auto; }
}

.pad-hint {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 16px 0;
  font-size: 12px; font-weight: 600; color: var(--ink-3);
}
.pad-hint b { color: var(--accent-ink); font-weight: 700; }

.pad-quick {
  display: flex; gap: 6px; overflow-x: auto;
  padding: 8px 16px; scrollbar-width: none;
}
.pad-quick::-webkit-scrollbar { display: none; }
.pad-quick button {
  flex: 0 0 auto;
  padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: var(--surface-2);
  font-family: var(--font-num); font-size: 13.5px; font-weight: 600;
  color: var(--ink-2); white-space: nowrap;
}
.pad-quick button:hover { border-color: var(--accent); color: var(--ink); }

.pad-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
  padding: 0 12px 12px;
}
.pad-grid button {
  height: 48px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--line);
  font-family: var(--font-num); font-size: 21px; font-weight: 600;
  transition: background .08s ease;
}
.pad-grid button:active { background: var(--surface-3); }
.pad-grid .k-util { font-family: var(--font-ui); font-size: 15px; font-weight: 700; color: var(--ink-2); }
.pad[data-active="false"] .pad-grid button,
.pad[data-active="false"] .pad-quick button { opacity: .4; pointer-events: none; }

@media (max-height: 700px) {
  .pad-grid button { height: 44px; font-size: 19px; }
}

/* ---------- 設定 -------------------------------------------------------- */

.lock-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto;
  align-items: center; gap: 12px;
  padding: 12px 14px; border-bottom: 1px solid var(--line);
}
.lock-row:last-child { border-bottom: none; }
.lock-info { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.lock-name { font-size: 14.5px; font-weight: 600; }
.lock-est { font-size: 11.5px; color: var(--ink-3); font-family: var(--font-num); }
.lock-input {
  width: 128px; padding: 8px 11px; text-align: right;
  font-family: var(--font-num); font-size: 14px;
  background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 9px;
}
.lock-input:focus { border-color: var(--accent); outline: none; }
.lock-input::placeholder { color: var(--ink-3); font-family: var(--font-ui); font-size: 12.5px; }
.lock-input[data-locked="true"] { border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

.setting-row {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 13px 14px; border-bottom: 1px solid var(--line);
}
.setting-row:last-child { border-bottom: none; }
.setting-info { min-width: 0; }
.setting-name { font-size: 14.5px; font-weight: 600; }
.setting-desc { font-size: 12px; color: var(--ink-3); margin-top: 2px; line-height: 1.45; }
.setting-control { flex: 0 0 auto; display: flex; align-items: center; gap: 9px; }
.setting-control input[type="range"] { width: 112px; accent-color: var(--accent); }
.setting-control input[type="number"] {
  width: 78px; padding: 7px 10px; text-align: right;
  font-family: var(--font-num); font-size: 14px;
  background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 9px;
}
.setting-value { font-family: var(--font-num); font-size: 13.5px; color: var(--ink-2); width: 46px; text-align: right; }

/* 手機上滑桿佔掉一半寬度，說明文字會被擠成細細一長條。窄螢幕改成上下排。 */
@media (max-width: 560px) {
  .setting-row { flex-direction: column; align-items: stretch; gap: 11px; }
  .setting-control { justify-content: flex-end; }
  .setting-control input[type="range"] { flex: 1; width: auto; }
}

.switch { position: relative; width: 44px; height: 26px; flex: 0 0 44px; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch span {
  position: absolute; inset: 0; border-radius: 999px;
  background: var(--surface-3); border: 1px solid var(--line-strong);
  transition: background .16s ease, border-color .16s ease;
  pointer-events: none;
}
.switch span::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--ink-3); transition: transform .16s ease, background .16s ease;
}
.switch input:checked + span { background: var(--accent-soft); border-color: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); background: var(--accent); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- 擬合診斷表 -------------------------------------------------- */

.fit-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.fit-table th {
  text-align: left; padding: 8px 10px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-3); border-bottom: 1px solid var(--line);
}
.fit-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); }
.fit-table tr:last-child td { border-bottom: none; }
.fit-table .n { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.table-wrap { overflow-x: auto; }

/* ---------- 吐司 -------------------------------------------------------- */

.toast {
  position: fixed; left: 50%; z-index: 60;
  bottom: calc(92px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 14px);
  padding: 10px 17px; border-radius: 999px;
  background: var(--ink); color: var(--plane);
  font-size: 13.5px; font-weight: 600;
  opacity: 0; pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
  max-width: calc(100vw - 32px);
