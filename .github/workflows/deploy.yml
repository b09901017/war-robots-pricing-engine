name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；新的 push 進來就讓正在排隊的那個先完成，不中途取消。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 用 npm test 而不是直接寫 node --test 'test/*.test.js'：
      # 加了引號等於要 node 自己展開萬用字元，那是 Node 22 才有的行為，
      # 舊版會把整串當成真實檔名去找然後失敗。交給 shell 展開就沒有版本問題。
      - name: 跑演算法測試
        run: npm test

      - name: 建置網站
        run: node tools/build.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # enablement: true 會順便幫這個 repo 打開 Pages，
      # 省掉手動去 Settings → Pages 設定的步驟。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
